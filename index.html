<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가림고 EVERYTIME</title>
<!--
  가림고등학교 학교 커뮤니티
  탭: 분실물 · 자유게시판 · 급식 · 시간표 · 행사 · 공부방
  - 글/댓글/행사: Firestore   - 공부방(누가 공부 중인지): Realtime Database
  - 급식/시간표/학사일정: 나이스 교육정보 개방포털 API
  주의: 파일을 더블클릭해서 열면 로그인이 안 돼요. 웹에 올린 주소로 접속하세요.
-->
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --fg: #222; --muted: #808389; --line: #e6e6e6; --soft: #f0f1f4;
  --accent: #c62917; --lost-bg: #ffe3e0; --found-bg: #dff3e4; --found-fg: #1d7a3a;
  --study: #2f6fde; --study-bg: #e4edfc;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16171a; --card: #22242a; --fg: #eee; --muted: #9a9ca2; --line: #33363d; --soft: #2a2c33;
          --accent: #ff6b57; --lost-bg: #4a2420; --found-bg: #1f3d29; --found-fg: #7fd69a;
          --study: #7aa7ff; --study-bg: #1e2b45; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--fg); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px 6px; max-width: 900px; margin: 0 auto; }
.logo { font-weight: 800; font-size: 1.2rem; color: var(--accent); cursor: pointer; }
.hbtns { display: flex; gap: 6px; align-items: center; }
nav.main { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px; max-width: 900px; margin: 0 auto; scrollbar-width: none; }
nav.main button { flex-shrink: 0; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 10px 8px; cursor: pointer; color: var(--muted); font-weight: 600; }
nav.main button.on { color: var(--fg); border-bottom-color: var(--accent); }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
h2 { margin: 4px 0 12px; }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.gray { background: var(--soft); color: var(--fg); }
.btn.blue { background: var(--study); }
.btn.big { width: 100%; padding: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button { padding: 7px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
.tabs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.filters .grow { flex: 1 1 200px; }
.check { font-size: .9rem; display: flex; gap: 4px; align-items: center; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

/* 목록 카드 + ⋯ 메뉴 */
.list { display: grid; gap: 10px; }
.cardwrap { position: relative; }
.card { display: flex; gap: 12px; background: var(--card); padding: 12px 44px 12px 12px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
.card.done { opacity: .55; }
.card > div { min-width: 0; }
.thumb { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--bg); display: grid; place-items: center; font-size: 2rem; }
.card h3 { margin: 6px 0 4px; font-size: 1.05rem; overflow-wrap: anywhere; }
.snippet { margin: 0 0 4px; color: var(--muted); font-size: .92rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.more { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; font-size: 1.3rem; line-height: 1; color: var(--muted); }
.more:hover { background: var(--soft); }
.menu { position: absolute; top: 44px; right: 8px; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); min-width: 190px; padding: 6px; display: grid; }
.menu button { text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--soft); }
.menu .danger { color: var(--accent); font-weight: 600; }
.menu .who { font-size: .78rem; color: var(--muted); padding: 4px 12px 6px; }

.meta { color: var(--muted); font-size: .85rem; margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 36px 16px; background: var(--card); border-radius: 12px; border: 1px solid var(--line); line-height: 1.6; }
.badge { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 6px; font-weight: 700; margin-right: 4px; }
.badge.lost { background: var(--lost-bg); color: var(--accent); }
.badge.found { background: var(--found-bg); color: var(--found-fg); }
.badge.resolved { background: var(--line); color: var(--muted); }
.badge.school { background: var(--study-bg); color: var(--study); }
.badge.club { background: var(--lost-bg); color: var(--accent); }

.panel { background: var(--card); padding: 18px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--line); }
.write { display: grid; gap: 12px; }
.write label { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kind-pick { display: flex; gap: 16px; }
.kind-pick label { display: flex; gap: 6px; align-items: center; font-weight: 600; }
.photo { width: 100%; max-height: 420px; object-fit: contain; background: var(--bg); border-radius: 10px; margin: 12px 0; }
dl { display: grid; grid-template-columns: 80px 1fr; gap: 6px 10px; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
.desc { white-space: pre-wrap; line-height: 1.6; overflow-wrap: anywhere; }
.owner { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.comment { border-bottom: 1px solid var(--line); padding: 8px 0; }
.comment p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.comment .writer { color: var(--accent); }
.cdel { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .8rem; }
.cform { display: flex; gap: 6px; margin-top: 10px; }
.cform textarea { flex: 1; min-width: 0; }
.back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 0; margin-bottom: 6px; }
.err { color: var(--accent); font-size: .9rem; margin: 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 50; max-width: calc(100% - 32px); }
.login { text-align: center; padding: 48px 20px; }
.login p { color: var(--muted); line-height: 1.6; }

/* 급식 */
.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.datenav strong { font-size: 1.1rem; }
.meals { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.meal h3 { margin: 0 0 8px; font-size: 1rem; }
.meal ul { margin: 0; padding-left: 18px; line-height: 1.8; }
.meal .meta { margin-top: 8px; }

/* 시간표 */
.tt-wrap { overflow-x: auto; background: var(--card); border-radius: 12px; border: 1px solid var(--line); }
table.tt { border-collapse: collapse; width: 100%; min-width: 520px; font-size: .92rem; }
.tt th, .tt td { border-bottom: 1px solid var(--line); padding: 10px 6px; text-align: center; }
.tt th { background: var(--soft); font-weight: 700; }
.tt td.p { color: var(--muted); width: 44px; }
.tt .today { background: var(--study-bg); }

/* 행사 */
.ev { display: flex; gap: 12px; align-items: flex-start; }
.ev .day { flex-shrink: 0; width: 56px; text-align: center; background: var(--soft); border-radius: 10px; padding: 6px 0; }
.ev .day b { display: block; font-size: 1.3rem; }
.ev .day span { font-size: .75rem; color: var(--muted); }
.ev h3 { margin: 2px 0 4px; font-size: 1rem; }
.month-group { margin: 18px 0 8px; color: var(--muted); font-weight: 700; font-size: .9rem; }

/* 공부방 */
.rooms { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.room { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: left; cursor: pointer; }
.room h3 { margin: 0 0 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2fb35a; margin-right: 6px; vertical-align: middle; }
.dot.pause { background: #d9a520; }
.mytimer { text-align: center; padding: 24px 12px; }
.mytimer .clock { font-size: clamp(2.6rem, 12vw, 4rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.mytimer .ctrl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.member { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 8px; }
.member:last-child { border-bottom: 0; }
.member .name { min-width: 0; overflow-wrap: anywhere; }
.tmr { font-variant-numeric: tabular-nums; font-weight: 700; }
.rank { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.rank:last-child { border-bottom: 0; }
.rank .n { color: var(--muted); font-weight: 700; text-align: center; }
.studybar { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--study-bg); color: var(--study); padding: 8px 16px; font-weight: 600; font-size: .9rem; cursor: pointer; }
.focus { position: fixed; inset: 0; z-index: 40; background: #0e1116; color: #f2f4f8; display: grid; place-items: center; text-align: center; padding: 24px; }
.focus .clock { font-size: clamp(3.5rem, 18vw, 8rem); font-weight: 800; font-variant-numeric: tabular-nums; }
.focus p { color: #9aa3b2; }
.focus .ctrl { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
@media (prefers-reduced-motion: no-preference) { .focus .clock.run { animation: breathe 4s ease-in-out infinite; } }
@keyframes breathe { 50% { opacity: .82; } }
</style>
</head>
<body>
<div class="top">
  <header>
    <span class="logo" id="home">가림고 EVERYTIME</span>
    <div class="hbtns">
      <button class="btn" id="goWrite" hidden>+ 글쓰기</button>
      <button class="btn ghost" id="logout" hidden>로그아웃</button>
    </div>
  </header>
  <nav class="main" id="nav" hidden></nav>
  <div class="studybar" id="studybar" hidden></div>
</div>
<main id="app"><div class="empty">불러오는 중…</div></main>
<div class="toast" id="toast" hidden></div>
<div class="focus" id="focus" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, getDocs, onSnapshot,
         query, orderBy, limit, where, serverTimestamp, writeBatch, increment }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getDatabase, ref as dbRef, set as dbSet, update as dbUpdate, remove as dbRemove, get as dbGet,
         onValue, onDisconnect, serverTimestamp as dbNow }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

// =====================================================================
//  설정 — 여기만 바꾸면 돼요
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBPGc5RN5j-V4DwPzKHdI-WzDM6LE45jNU",
  authDomain: "everttime-e595f.firebaseapp.com",
  projectId: "everttime-e595f",
  storageBucket: "everttime-e595f.firebasestorage.app",
  messagingSenderId: "998168532418",
  appId: "1:998168532418:web:69dfb070b9f7742b88325b",
  // ↓ 공부방용 Realtime Database 주소. Firebase 콘솔 → Realtime Database 화면 맨 위에 나오는 주소로 바꾸세요.
  databaseURL: "https://everttime-e595f-default-rtdb.asia-southeast1.firebasedatabase.app",
};

// 학교 계정만 로그인 (kko58-…@gclass.ice.go.kr). 보안 규칙에도 같은 조건이 있어요.
const ALLOWED_DOMAIN = "gclass.ice.go.kr";
const ALLOWED_PREFIX = "kko58-";
// 관리자: 모든 글·댓글 삭제, 해결 처리, 행사 등록 가능. 보안 규칙 두 개에도 같은 이메일을 넣으세요.
const ADMIN_EMAILS = ["jaung0622@gmail.com"];

// 나이스(급식·시간표·학사일정)
const SCHOOL_NAME = "가림고등학교";
const OFFICE_CODE = "E10";          // 인천광역시교육청
const SCHOOL_CODE = "";             // 비워두면 학교 이름으로 자동 검색. 알면 7자리 학교코드를 넣어도 돼요.
const NEIS_KEY = "";                // open.neis.go.kr 에서 무료로 받는 인증키. 없으면 급식만 되고 시간표는 안 나와요.

const CATEGORIES = ["전자기기", "필기구", "의류", "지갑/카드", "책/노트", "물병/텀블러", "기타"];
const LOCATIONS  = ["교실", "복도", "체육관", "운동장", "급식실", "도서관", "화장실", "매점", "음악실", "과학실"]; // 장소 추천 목록
const STUDY_ROOMS = [
  { id: "g1", name: "1학년 열람실" },
  { id: "g2", name: "2학년 열람실" },
  { id: "g3", name: "3학년 열람실" },
  { id: "free", name: "자유 공부방" },
];
// =====================================================================

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const fs = getFirestore(fb);
let rtdb = null;
try { rtdb = getDatabase(fb); } catch (e) { console.warn("Realtime Database 연결 실패", e); }

const TABS = [
  ["lost", "분실물"], ["free", "자유게시판"], ["meal", "급식"],
  ["time", "시간표"], ["event", "행사"], ["study", "공부방"],
];

let me = null;
let tab = "lost";
let view = "list";                 // list | write | detail
let currentColl = null, currentId = null, comments = [];
const data = { posts: [], free: [], events: [] };
const loaded = { posts: false, free: false, events: false };
const subs = {};
let unsubComments = null;
let openMenuKey = null, menuSure = false;
let lostFilter = { kind: "", q: "", category: "", showResolved: false };
let freeQ = "";

const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeImg = s => typeof s === "string" && s.startsWith("data:image/") ? esc(s) : "";
const kindLabel = k => k === "lost" ? "잃어버렸어요" : "주웠어요";
const ADMINS = ADMIN_EMAILS.map(e => String(e).trim().toLowerCase());
const isAdmin = () => !!me && ADMINS.includes((me.email || "").toLowerCase());
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
const dash = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
const fmt = ts => {
  if (!ts?.toDate) return "방금";
  const d = ts.toDate();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const hms = sec => { sec = Math.max(0, Math.floor(sec)); return `${pad(Math.floor(sec / 3600))}:${pad(Math.floor(sec / 60) % 60)}:${pad(sec % 60)}`; };
const options = (list, sel, first) => (first ? `<option value="">${first}</option>` : "") +
  list.map(v => `<option ${v === sel ? "selected" : ""}>${esc(v)}</option>`).join("");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.hidden = true, 2800);
}
function fail(e) {
  console.error(e);
  const c = e?.code || "";
  toast(c.includes("permission") ? "권한이 없어요. 로그인 상태나 보안 규칙을 확인해주세요." : "오류가 났어요: " + (e?.message || e));
}

// =====================================================================
//  로그인
// =====================================================================
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

onAuthStateChanged(auth, async user => {
  const email = (user?.email || "").toLowerCase();
  const isSchool = email.startsWith(ALLOWED_PREFIX) && email.endsWith("@" + ALLOWED_DOMAIN);
  if (user && ALLOWED_DOMAIN && !isSchool && !ADMINS.includes(email)) {
    toast("우리 학교 계정(" + ALLOWED_PREFIX + "…@" + ALLOWED_DOMAIN + ")으로만 로그인할 수 있어요.");
    signOut(auth); return;
  }
  me = user;
  $("logout").hidden = !user;
  $("nav").hidden = !user;
  if (!user) {
    Object.values(subs).forEach(u => u?.()); for (const k in subs) delete subs[k];
    for (const k in loaded) loaded[k] = false;
    unsubComments?.(); unsubComments = null;
    $("goWrite").hidden = true;
    return renderLogin();
  }
  startStudyWatch();
  go(store.get("tab", "lost"));
});

function renderLogin() {
  app.innerHTML = `
    <div class="panel login">
      <h2>가림고 EVERYTIME</h2>
      <p>분실물 찾기, 자유게시판, 급식과 시간표, 학교 행사, 같이 공부하는 공부방까지.<br>
      학교 구글 계정(${esc(ALLOWED_PREFIX)}…@${esc(ALLOWED_DOMAIN)})으로 로그인해주세요.<br>
      게시판에는 익명으로 표시돼요.</p>
      <button class="btn big" id="loginBtn">구글로 로그인</button>
      ${location.protocol === "file:" ? `<p class="err" style="margin-top:12px">지금은 파일로 열려 있어서 로그인이 안 돼요. 웹에 올린 주소로 접속해주세요.</p>` : ""}
    </div>`;
  $("loginBtn").onclick = () => signInWithPopup(auth, provider).catch(e => {
    if (e.code === "auth/unauthorized-domain") toast("이 주소가 Firebase 승인된 도메인에 없어요. Authentication 설정에서 추가해주세요.");
    else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") fail(e);
  });
}

// =====================================================================
//  탭 이동
// =====================================================================
function go(t) {
  tab = TABS.some(x => x[0] === t) ? t : "lost";
  store.set("tab", tab);
  view = "list"; openMenuKey = null;
  unsubComments?.(); unsubComments = null;
  $("nav").innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${l}</button>`).join("");
  $("goWrite").hidden = !(tab === "lost" || tab === "free" || (tab === "event" && isAdmin()));
  $("goWrite").textContent = tab === "event" ? "+ 행사 등록" : "+ 글쓰기";
  updateStudybar();
  render();
}
$("nav").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
$("home").onclick = () => me ? go("lost") : renderLogin();
$("goWrite").onclick = () => { view = "write"; render(); };
$("logout").onclick = async () => { await leaveRoom(); signOut(auth); };

function render() {
  if (!me) return renderLogin();
  if (tab === "lost") return view === "write" ? renderLostWrite() : view === "detail" ? renderDetail() : renderLostList();
  if (tab === "free") return view === "write" ? renderFreeWrite() : view === "detail" ? renderDetail() : renderFreeList();
  if (tab === "meal") return renderMeal();
  if (tab === "time") return renderTimetable();
  if (tab === "event") return view === "write" ? renderEventWrite() : renderEvents();
  if (tab === "study") return renderStudy();
}

// 컬렉션은 그 탭을 처음 열 때 한 번만 구독 (읽기 횟수 아끼기)
function ensure(coll) {
  if (subs[coll]) return;
  subs[coll] = () => {};   // 구독 중복 방지 (아래에서 진짜 해제 함수로 바뀜)
  const q = coll === "events"
    ? query(collection(fs, "events"), orderBy("date"), limit(200))
    : query(collection(fs, coll), orderBy("createdAt", "desc"), limit(coll === "posts" ? 150 : 100));
  subs[coll] = onSnapshot(q, snap => {
    data[coll] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded[coll] = true;
    const mine = (coll === "posts" && tab === "lost") || (coll === "free" && tab === "free") || (coll === "events" && tab === "event");
    if (mine && (view === "list" || view === "detail")) render();
  }, fail);
}

// =====================================================================
//  ⋯ 메뉴 (글쓴이·관리자용)
// =====================================================================
function canManage(p) { return !!me && (p.uid === me.uid || isAdmin()); }
function moreButton(coll, p) {
  if (!canManage(p)) return "";
  const key = coll + "/" + p.id;
  return `<button class="more" data-menu="${esc(key)}" aria-label="관리 메뉴" aria-expanded="${openMenuKey === key}">⋯</button>
    ${openMenuKey === key ? menuHtml(coll, p) : ""}`;
}
function menuHtml(coll, p) {
  const mine = p.uid === me.uid;
  const items = [];
  if (coll === "posts") items.push(`<button data-act="toggleResolved">${p.resolved ? "해결 취소하기" : "해결됨으로 표시"}</button>`);
  if (coll !== "events") items.push(`<button data-act="open">글 열기</button>`);
  items.push(`<button data-act="delete" class="danger">${menuSure ? "정말 삭제할까요? 한 번 더 누르기" : "삭제"}</button>`);
  return `<div class="menu" role="menu">
    <div class="who">${mine ? "내 글" : "관리자 권한"}</div>${items.join("")}</div>`;
}
document.addEventListener("click", async e => {
  const moreBtn = e.target.closest("[data-menu]");
  const act = e.target.closest(".menu [data-act]");
  if (moreBtn) {
    e.stopPropagation();
    openMenuKey = openMenuKey === moreBtn.dataset.menu ? null : moreBtn.dataset.menu;
    menuSure = false; render(); return;
  }
  if (act) {
    e.stopPropagation();
    const [coll, id] = openMenuKey.split("/");
    const p = data[coll].find(x => x.id === id);
    if (!p) { openMenuKey = null; return render(); }
    const a = act.dataset.act;
    if (a === "open") { openMenuKey = null; return openDetail(coll, id); }
    if (a === "toggleResolved") {
      openMenuKey = null;
      try { await updateDoc(doc(fs, coll, id), { resolved: !p.resolved }); toast(p.resolved ? "해결 표시를 취소했어요" : "해결됨으로 표시했어요"); }
      catch (err) { fail(err); }
      return render();
    }
    if (a === "delete") {
      if (!menuSure) { menuSure = true; return render(); }
      openMenuKey = null; menuSure = false;
      return deleteItem(coll, id);
    }
  }
  if (openMenuKey && !e.target.closest(".menu")) { openMenuKey = null; menuSure = false; render(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && openMenuKey) { openMenuKey = null; render(); } });

async function deleteItem(coll, id) {
  try {
    const batch = writeBatch(fs);
    if (coll !== "events") {
      const cs = await getDocs(collection(fs, coll, id, "comments"));
      cs.forEach(c => batch.delete(c.ref));
    }
    batch.delete(doc(fs, coll, id));
    await batch.commit();
    toast("삭제했어요");
    if (view === "detail") { view = "list"; unsubComments?.(); unsubComments = null; }
    render();
  } catch (err) { fail(err); }
}

function showErr(msg) { $("wErr").textContent = msg; $("wErr").hidden = false; }

function photoField() {
  return `<label>사진 <small>(학생증·이름표 등은 이름과 번호를 가려주세요. 다른 사람 얼굴 사진은 올리지 마세요)</small><input type="file" id="wImg" accept="image/*"></label>
    <p class="meta" id="wImgMsg" hidden></p>
    <img class="photo" id="wPreview" alt="첨부한 사진 미리보기" hidden>`;
}
function bindPhoto() {
  let image = null, busy = false;
  $("wImg").onchange = async e => {
    const file = e.target.files[0];
    image = null; $("wPreview").hidden = true; $("wImgMsg").hidden = true;
    if (!file) return;
    busy = true; $("wImgMsg").textContent = "사진 준비 중…"; $("wImgMsg").hidden = false;
    image = await shrinkImage(file);
    busy = false;
    if (!$("wPreview")) return;
    if (image) { $("wPreview").src = image; $("wPreview").hidden = false; $("wImgMsg").textContent = "이 사진이 함께 올라가요."; }
    else { e.target.value = ""; $("wImgMsg").textContent = "이 사진은 읽을 수 없는 형식이에요. 화면 캡처하거나 JPG/PNG 사진으로 다시 골라주세요."; }
  };
  return { value: () => image, busy: () => busy };
}

// 사진을 작게 줄여서 저장 (Firestore 글 하나는 1MB까지라서)
async function shrinkImage(file) {
  let source = await new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
  if (!source && window.createImageBitmap) {
    try { source = await createImageBitmap(file); } catch (e) { source = null; }
  }
  if (!source) return null;
  const w = source.naturalWidth || source.width, h = source.naturalHeight || source.height;
  if (!w || !h) return null;
  let max = 800, quality = 0.75, out = "";
  for (let i = 0; i < 5; i++) {
    const scale = Math.min(1, max / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(source, 0, 0, c.width, c.height);
    out = c.toDataURL("image/jpeg", quality);
    if (out.length <= 400000) break;
    max = Math.round(max * 0.8); quality = Math.max(0.5, quality - 0.1);
  }
  return out.startsWith("data:image/jpeg") && out.length <= 450000 ? out : null;
}

function openDetail(coll, id) {
  view = "detail"; currentColl = coll; currentId = id; comments = []; openMenuKey = null;
  unsubComments?.();
  unsubComments = onSnapshot(query(collection(fs, coll, id, "comments"), orderBy("createdAt")), snap => {
    comments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (view === "detail" && currentId === id) renderDetail();
  }, fail);
  render();
}

      <p class="desc">${esc(p.body)}</p>
      ${safeImg(p.image) ? `<img class="photo" src="${safeImg(p.image)}" alt="">` : ""}`;

    <button class="back" id="back">← 목록으로</button>

        <button class="btn ghost" id="del">삭제${!mine ? " (관리자)" : ""}</button>

    </article>
    <section class="panel">
      <h3>댓글 ${comments.length}</h3>
      ${comments.map(c => `
        <div class="comment">
          <b class="${c.uid === p.uid ? "writer" : ""}">${nameOf(c.uid)}</b> <span class="meta">${fmt(c.createdAt)}</span>
          ${c.uid === me.uid || mine || isAdmin() ? `<button class="cdel" data-cid="${esc(c.id)}">삭제</button>` : ""}
          <p>${esc(c.text)}</p>
        </div>`).join("")}

        <textarea id="cText" rows="2" maxlength="500" placeholder="댓글 남기기">${esc(draft)}</textarea>

    if ($("cSubmit")) $("cSubmit").disabled = false;
  };
}

// =====================================================================
//  나이스 API (급식 · 시간표 · 학사일정)
// =====================================================================
const neisCache = {};
async function schoolCodes() {
  if (SCHOOL_CODE) return { office: OFFICE_CODE, school: SCHOOL_CODE };
  const saved = store.get("neisSchool", null);
  if (saved?.name === SCHOOL_NAME) return saved;
  const rows = await neisRaw("schoolInfo", { ATPT_OFCDC_SC_CODE: OFFICE_CODE, SCHUL_NM: SCHOOL_NAME });
  const hit = rows.find(r => r.SCHUL_NM === SCHOOL_NAME) || rows[0];
  if (!hit) throw new Error(`나이스에서 '${SCHOOL_NAME}'을(를) 찾지 못했어요.`);
  const codes = { name: SCHOOL_NAME, office: hit.ATPT_OFCDC_SC_CODE, school: hit.SD_SCHUL_CODE };
  store.set("neisSchool", codes);
  return codes;
}
async function neisRaw(endpoint, params) {
  const u = new URL("https://open.neis.go.kr/hub/" + endpoint);
  const p = { Type: "json", pIndex: 1, pSize: NEIS_KEY ? 100 : 5, ...params };
  if (NEIS_KEY) p.KEY = NEIS_KEY;
  Object.entries(p).forEach(([k, v]) => u.searchParams.set(k, v));
  const key = u.toString();
  if (neisCache[key]) return neisCache[key];
  let res;
  try { res = await fetch(u); } catch (e) { throw new Error("나이스 서버에 연결하지 못했어요. 인터넷 연결을 확인하거나 잠시 후 다시 시도해주세요."); }
  const j = await res.json();
  const body = j[endpoint];
  if (!body) {
    const code = j.RESULT?.CODE || "";
    if (code === "INFO-200") return (neisCache[key] = []);   // 해당 데이터 없음
    throw new Error("나이스: " + (j.RESULT?.MESSAGE || "알 수 없는 오류"));
  }
  return (neisCache[key] = body[1]?.row || []);
}
async function neis(endpoint, params) {
  const c = await schoolCodes();
  return neisRaw(endpoint, { ATPT_OFCDC_SC_CODE: c.office, SD_SCHUL_CODE: c.school, ...params });
}

//  공부방 (열품타 + 디스코드 느낌) — Realtime Database
// =====================================================================
let serverOffset = 0;
let roomsData = {}, totalsData = {}, totalsDay = "";
let study = { room: null, status: null, startedAt: 0, base: 0, nickname: "" };
let studyWatching = false, saveTimer = null, autoPausedNotice = false;
let myRoomRef = null;
const todayKey = () => ymd(new Date());
const myElapsed = () => study.status === "studying"
  ? study.base + Math.max(0, (Date.now() + serverOffset - study.startedAt) / 1000) : study.base;
const memberElapsed = m => m.status === "studying" && m.startedAt
  ? (m.base || 0) + Math.max(0, (Date.now() + serverOffset - m.startedAt) / 1000) : (m.base || 0);

function startStudyWatch() {
  if (!rtdb || studyWatching) return;
  studyWatching = true;
  onValue(dbRef(rtdb, ".info/serverTimeOffset"), s => { serverOffset = s.val() || 0; });
  onValue(dbRef(rtdb, "rooms"), s => { roomsData = s.val() || {}; if (tab === "study") renderStudy(); },
    e => { console.warn(e); roomsData = {}; });
  // 연결이 끊겼다 다시 붙으면 공부방에 다시 들어가기
  onValue(dbRef(rtdb, ".info/connected"), s => { if (s.val() && study.room && me) writePresence().catch(console.warn); });
}
function watchTotals() {
  const day = todayKey();
  if (totalsDay === day) return;
  totalsDay = day;
  onValue(dbRef(rtdb, "totals/" + day), s => { totalsData = s.val() || {}; if (tab === "study") renderStudy(); }, console.warn);
}
async function writePresence() {
  myRoomRef = dbRef(rtdb, `rooms/${study.room}/${me.uid}`);
  await onDisconnect(myRoomRef).remove();
  await dbSet(myRoomRef, {
    nickname: study.nickname, status: study.status,
    startedAt: study.status === "studying" ? dbNow() : 0, base: Math.floor(study.base),
  });
  if (study.status === "studying") study.startedAt = Date.now() + serverOffset;
}
async function saveTotal() {
  if (!study.room) return;
  await dbSet(dbRef(rtdb, `totals/${todayKey()}/${me.uid}`), { nickname: study.nickname, seconds: Math.min(86400, Math.floor(myElapsed())) });
}

async function enterRoom(roomId) {
  if (!rtdb) return toast("공부방 데이터베이스가 아직 설정되지 않았어요.");
  const nickname = ($("nick")?.value || store.get("nick", "")).trim();
  if (!nickname) { toast("공부방에서 쓸 닉네임을 먼저 정해주세요."); $("nick")?.focus(); return; }
  store.set("nick", nickname);
  try {
    if (study.room && study.room !== roomId) await leaveRoom();
    const t = await dbGet(dbRef(rtdb, `totals/${todayKey()}/${me.uid}`));
    study = { room: roomId, status: "paused", startedAt: 0, base: t.val()?.seconds || 0, nickname };
    await writePresence();
    renderStudy();
  } catch (e) { study.room = null; fail(e); }
}
async function startStudy() {
  if (!study.room) return;
  study.status = "studying"; study.startedAt = Date.now() + serverOffset;
  try {
    await dbUpdate(myRoomRef, { status: "studying", startedAt: dbNow(), base: Math.floor(study.base) });
    clearInterval(saveTimer); saveTimer = setInterval(() => saveTotal().catch(console.warn), 60000);
  } catch (e) { fail(e); }
  renderStudy(); renderFocus();
}
async function pauseStudy() {
  if (!study.room || study.status !== "studying") return;
  study.base = myElapsed(); study.status = "paused";
  clearInterval(saveTimer);
  try {
    await dbUpdate(myRoomRef, { status: "paused", startedAt: 0, base: Math.floor(study.base) });
    await saveTotal();
  } catch (e) { fail(e); }
  renderStudy(); renderFocus();
}
async function leaveRoom() {
  if (!study.room || !rtdb) return;
  try {
    if (study.status === "studying") { study.base = myElapsed(); study.status = "paused"; }
    clearInterval(saveTimer);
    await saveTotal();
    if (myRoomRef) { await onDisconnect(myRoomRef).cancel(); await dbRemove(myRoomRef); }
  } catch (e) { console.warn(e); }
  study = { room: null, status: null, startedAt: 0, base: 0, nickname: study.nickname };
  myRoomRef = null;
  $("focus").hidden = true;
  if (tab === "study") renderStudy();
}

// 열품타처럼: 공부 중에 다른 앱/탭으로 나가면 자동 일시정지
document.addEventListener("visibilitychange", () => {
  if (document.hidden && study.status === "studying" && store.get("autoPause", true)) { pauseStudy(); autoPausedNotice = true; }

});

function roomMembers(id) {
  return Object.entries(roomsData[id] || {}).map(([uid, m]) => ({ uid, ...m }))
    .sort((a, b) => (b.status === "studying") - (a.status === "studying") || memberElapsed(b) - memberElapsed(a));
}

        ${study.status === "studying"

        <button class="btn gray" id="focusBtn">집중 모드</button>
      </div>
    </div>
    <section class="panel">
      <h3 style="margin-top:0">지금 이 방에 있는 사람 ${ms.length}명</h3>
      ${ms.length ? ms.map(m => `

        </div>`).join("") : `<p class="meta">아직 아무도 없어요.</p>`}
    </section>
    ${rankingHtml()}`;
  $("leave").onclick = leaveRoom;
  $("start")?.addEventListener("click", startStudy);
  $("pause")?.addEventListener("click", pauseStudy);
  $("focusBtn").onclick = () => { $("focus").hidden = false; renderFocus(); document.documentElement.requestFullscreen?.().catch(() => {}); };

function rankingHtml() {
  // 오늘 기록 + 지금 공부 중인 사람의 실시간 시간 합치기
  const best = {};
  Object.entries(totalsData).forEach(([uid, t]) => best[uid] = { nickname: t.nickname, sec: t.seconds || 0 });
  Object.values(roomsData).forEach(r => Object.entries(r || {}).forEach(([uid, m]) => {
    const s = memberElapsed(m); if (!best[uid] || s > best[uid].sec) best[uid] = { nickname: m.nickname, sec: s };
  }));
  const list = Object.entries(best).sort((a, b) => b[1].sec - a[1].sec).slice(0, 10);
  return `<section class="panel"><h3 style="margin-top:0">오늘의 공부 랭킹</h3>
    ${list.length ? list.map(([uid, b], i) => `<div class="rank"><span class="n">${i + 1}</span>
      <span>${esc(b.nickname)}${uid === me.uid ? " (나)" : ""}</span><span class="tmr" data-rank="${esc(uid)}">${hms(b.sec)}</span></div>`).join("")
      : `<p class="meta">오늘 아직 기록이 없어요. 첫 번째로 공부를 시작해보세요!</p>`}</section>`;
}

    <p>${study.status === "studying" ? "집중하는 중이에요. 화면을 나가면 일시정지돼요." : "일시정지 중"}</p>
    <div class="ctrl">
      ${study.status === "studying" ? `<button class="btn gray" id="fPause">⏸ 일시정지</button>` : `<button class="btn blue" id="fStart">▶ 공부 시작</button>`}
      <button class="btn gray" id="fExit">집중 모드 끄기</button>
    </div></div>`;
  $("fPause")?.addEventListener("click", pauseStudy);
  $("fStart")?.addEventListener("click", startStudy);
  $("fExit").onclick = () => { f.hidden = true; document.fullscreenElement && document.exitFullscreen?.().catch(() => {}); };
}

function updateStudybar() {
  const bar = $("studybar");
  if (!study.room || tab === "study") { bar.hidden = true; return; }
  const room = STUDY_ROOMS.find(r => r.id === study.room) || { name: "" };
  bar.hidden = false;
  bar.innerHTML = `<span>${study.status === "studying" ? "📖 공부 중" : "⏸ 쉬는 중"} · ${esc(room.name)}</span><span class="tmr" data-me>${hms(myElapsed())}</span>`;
}
$("studybar").onclick = () => go("study");

// 1초마다 타이머 숫자만 바꾸기 (화면 전체를 다시 그리지 않음)
setInterval(() => {
  document.querySelectorAll("[data-me]").forEach(el => el.textContent = hms(myElapsed()));
  document.querySelectorAll(".tmr[data-uid]").forEach(el => {
    const m = roomsData[study.room]?.[el.dataset.uid]; if (m) el.textContent = hms(memberElapsed(m));
  });
  if (todayKey() !== totalsDay && tab === "study") renderStudy();   // 자정이 지나면 오늘 기록 새로
}, 1000);
</script>
</body>
</html>
