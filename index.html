<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가림온</title>
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("theme")) || "light"; } catch (e) {}</script>
<!--
  가림고등학교 학교 커뮤니티
  탭: 분실물 · 자유게시판 · 급식 · 시간표 · 행사 · 공부방
  - 글/댓글/행사: Firestore   - 공부방(누가 공부 중인지): Realtime Database
  - 급식/시간표/학사일정: 나이스 교육정보 개방포털 API
  주의: 파일을 더블클릭해서 열면 로그인이 안 돼요. 웹에 올린 주소로 접속하세요.
-->
<style>
/* 네이버 카페 느낌: 흰 배경 + 왼쪽 메뉴 (폰에서는 메뉴가 위쪽 가로줄로) */
:root {
  --bg: #ffffff; --card: #ffffff; --fg: #222; --muted: #7d7f85; --line: #e4e5e8; --soft: #f5f6f7; --side: #fafafb;
  --accent: #c62917; --accent-soft: #fdf1ef; --lost-bg: #ffe3e0; --found-bg: #dff3e4; --found-fg: #1d7a3a;
  --study: #2f6fde; --study-bg: #e9f0fd; --pin-line: #f2cbc5;
  color-scheme: light;
}
/* 다크 모드 (내 프로필 → 설정에서 전환) */
:root[data-theme="dark"] {
  --bg: #17181b; --card: #222327; --fg: #e9e9ec; --muted: #9b9da4; --line: #35373d; --soft: #2c2e33; --side: #1d1e21;
  --accent: #ff6b57; --accent-soft: #3a2421; --lost-bg: #4a2420; --found-bg: #1f3d29; --found-fg: #7fd69a;
  --study: #7aa7ff; --study-bg: #1e2b45; --pin-line: #6b3a33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--fg); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }

.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 28px; max-width: 1100px; margin: 0 auto; padding: 24px 20px 40px; }
.side { display: grid; gap: 12px; align-content: start; position: sticky; top: 24px; }
.box { background: var(--side); border: 1px solid var(--line); border-radius: 6px; }
.cafe { padding: 20px 16px 16px; text-align: center; background: var(--card); }
.emblem { width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 10px; display: grid; place-items: center;
  background: var(--accent); color: #fff; font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em; }
.cafe .name { font-weight: 800; font-size: 1.12rem; cursor: pointer; }
.cafe .sub { color: var(--muted); font-size: .82rem; margin-top: 4px; }
.me { padding: 14px; display: grid; gap: 10px; }
.me .who { font-size: .88rem; line-height: 1.5; overflow-wrap: anywhere; }
.me .who b { font-size: .95rem; }
.mebtns { display: grid; gap: 6px; }
.mebtns .btn { width: 100%; padding: 10px; }
/* 디스코드처럼 접히는 카테고리 */
nav.main { display: grid; padding: 6px 0 10px; gap: 0; }
.navgrp { display: grid; gap: 2px; }
nav.main .grp { display: flex; align-items: center; gap: 4px; width: 100%; background: none; border: 0; cursor: pointer;
  padding: 12px 16px 4px; font-size: .8rem; font-weight: 700; color: var(--muted); text-align: left; }
nav.main .grp:hover { color: var(--fg); }
.grp .chev { width: 14px; height: 14px; flex-shrink: 0; transition: transform .15s; }
.navgrp.closed .grp .chev { transform: rotate(-90deg); }
@media (prefers-reduced-motion: reduce) { .grp .chev { transition: none; } }
.navgrp.closed .item:not(.on) { display: none; }   /* 접혀도 지금 보고 있는 게시판은 보이게 */
nav.main .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent;
  padding: 9px 16px 9px 13px; cursor: pointer; font-size: .95rem; }
nav.main .item:hover { background: var(--soft); }
nav.main .item.on { color: var(--accent); font-weight: 700; border-left-color: var(--accent); background: var(--accent-soft); }
.content { min-width: 0; }
.boardhead { border-bottom: 2px solid var(--fg); padding-bottom: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.boardhead > div { min-width: 0; }
.boardhead .btn { flex-shrink: 0; padding: 9px 18px; font-weight: 700; }
.badge.pin { background: var(--accent); color: #fff; }
.panel.welcome { background: var(--accent-soft); border-color: var(--pin-line); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font: inherit; }
.profile { display: flex; gap: 16px; align-items: center; }
.avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 1.8rem; font-weight: 800; flex-shrink: 0; }
.profile > div { min-width: 0; }
.profile h2 { overflow-wrap: anywhere; }
.nameform { display: flex; gap: 6px; }
.nameform input { flex: 1; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 8px 16px; cursor: pointer; }
.seg input:checked + span { background: var(--fg); color: var(--bg); font-weight: 700; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.myrow { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 2px; cursor: pointer; }
.myrow:last-child { border-bottom: 0; }
.myrow:hover .t { text-decoration: underline; }
.myrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.myrow .b { flex-shrink: 0; font-size: .78rem; padding: 2px 8px; border-radius: 6px; background: var(--soft); color: var(--muted); font-weight: 700; }
.author-pick { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.author-pick label { display: flex; gap: 6px; align-items: center; font-weight: 600; }
.named { color: var(--fg); font-weight: 700; }
.sortseg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
.sortseg button { background: var(--card); border: 0; padding: 8px 12px; cursor: pointer; color: var(--muted); }
.sortseg button.on { background: var(--fg); color: var(--bg); font-weight: 700; }
.stats { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.likebtn { display: inline-flex; gap: 6px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-weight: 700; }
.likebtn .h { color: var(--muted); font-size: 1.05rem; line-height: 1; }
.likebtn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.likebtn.on .h { color: var(--accent); }
.likebtn:disabled { opacity: .6; }
.cacts { display: inline-flex; gap: 8px; margin-left: 4px; }
.cacts button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .8rem; padding: 0; }
.cacts button:hover { color: var(--fg); text-decoration: underline; }
.replies { margin: 6px 0 2px 18px; padding-left: 12px; border-left: 2px solid var(--line); }
.replies .comment { padding: 6px 0; border-bottom: 0; }
.reply-mark { color: var(--muted); margin-right: 4px; }
.comment.gone > p { color: var(--muted); font-style: italic; margin: 0; }
.rform { display: flex; gap: 6px; margin: 6px 0 4px 18px; }
.rform textarea { flex: 1; min-width: 0; }
.welcome h2 { margin: 0 0 6px; font-size: 1.2rem; }
.welcome p { margin: 0 0 12px; line-height: 1.6; }
.welcome .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.welcome .quick .btn { background: var(--card); border: 1px solid var(--line); }
.card.pinned { background: var(--accent-soft); border-color: var(--pin-line); }
.adminbox { border: 1px dashed #e0a49b; border-radius: 8px; padding: 10px 12px 12px; display: grid; gap: 10px; margin: 0; }
.adminbox legend { font-weight: 700; font-size: .85rem; color: var(--accent); padding: 0 6px; }
.colors { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; display: inline-flex !important; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-block; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-weight: 700; font-size: .85rem; background: var(--card); }
.chip input:checked + span { border-color: currentColor; box-shadow: 0 0 0 1px currentColor inset; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.menucolors { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 8px 8px; max-width: 230px; }
.menu .menucolors button { padding: 6px 9px; font-weight: 700; border: 1px solid var(--line); border-radius: 999px; font-size: .82rem; }
.boardhead h1 { margin: 0; font-size: 1.4rem; }
.boardhead p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
main { padding: 0; }

@media (max-width: 780px) {
  .layout { grid-template-columns: 1fr; gap: 0; padding: 0 0 32px; }
  .side { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line);
    grid-template-columns: minmax(0, 1fr) auto; gap: 0; align-items: center; padding: 10px 16px 0; }
  .box { border: 0; background: none; border-radius: 0; }
  .cafe { padding: 0; text-align: left; display: flex; align-items: center; gap: 8px; }
  .emblem { width: 32px; height: 32px; margin: 0; font-size: .7rem; }
  .cafe .sub, .me .who { display: none; }
  .me { padding: 0; }
  .mebtns { display: flex; }
  .mebtns .btn { width: auto; padding: 7px 12px; font-size: .88rem; }
  nav.main { grid-column: 1 / -1; display: flex; overflow-x: auto; padding: 4px 0 0; scrollbar-width: none; gap: 0; }
  .navgrp { display: contents; }
  nav.main .grp { display: none; }
  .navgrp.closed .item:not(.on) { display: block; }   /* 폰에서는 접기 없이 전부 가로로 */
  nav.main .item { flex-shrink: 0; width: auto; border-left: 0; border-bottom: 3px solid transparent; padding: 10px 10px 8px; font-weight: 600; color: var(--muted); }
  nav.main .item:hover { background: none; }
  nav.main .item.on { background: none; border-bottom-color: var(--accent); color: var(--fg); }
  .studybar { grid-column: 1 / -1; margin: 0 -16px; border-radius: 0 !important; }
  .content { padding: 16px 16px 0; }
}
h2 { margin: 4px 0 12px; }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.gray { background: var(--soft); color: var(--fg); }
.btn.blue { background: var(--study); }
.btn.big { width: 100%; padding: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button { padding: 7px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
.tabs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.filters .grow { flex: 1 1 200px; }
.check { font-size: .9rem; display: flex; gap: 4px; align-items: center; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

/* 목록 카드 + ⋯ 메뉴 */
.list { display: grid; gap: 10px; }
.cardwrap { position: relative; }
.card { display: flex; gap: 12px; background: var(--card); padding: 12px 44px 12px 12px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
.card.done { opacity: .55; }
.card > div { min-width: 0; }
.thumb { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--soft); display: grid; place-items: center; font-size: 2rem; }
.card h3 { margin: 6px 0 4px; font-size: 1.05rem; overflow-wrap: anywhere; }
.snippet { margin: 0 0 4px; color: var(--muted); font-size: .92rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.more { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; font-size: 1.3rem; line-height: 1; color: var(--muted); }
.more:hover { background: var(--soft); }
.menu { position: absolute; top: 44px; right: 8px; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); min-width: 190px; padding: 6px; display: grid; }
.menu button { text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--soft); }
.menu .danger { color: var(--accent); font-weight: 600; }
.menu .who { font-size: .78rem; color: var(--muted); padding: 4px 12px 6px; }

.meta { color: var(--muted); font-size: .85rem; margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 36px 16px; background: var(--card); border-radius: 12px; border: 1px solid var(--line); line-height: 1.6; }
.badge { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 6px; font-weight: 700; margin-right: 4px; }
.badge.lost { background: var(--lost-bg); color: var(--accent); }
.badge.found { background: var(--found-bg); color: var(--found-fg); }
.badge.resolved { background: var(--line); color: var(--muted); }
.badge.school { background: var(--study-bg); color: var(--study); }
.badge.club { background: var(--lost-bg); color: var(--accent); }

.panel { background: var(--card); padding: 18px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--line); }
.write { display: grid; gap: 12px; }
.write label { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kind-pick { display: flex; gap: 16px; }
.kind-pick label { display: flex; gap: 6px; align-items: center; font-weight: 600; }
.photo { width: 100%; max-height: 420px; object-fit: contain; background: var(--soft); border-radius: 10px; margin: 12px 0; }
dl { display: grid; grid-template-columns: 80px 1fr; gap: 6px 10px; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
.desc { white-space: pre-wrap; line-height: 1.6; overflow-wrap: anywhere; }
.owner { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.comment { border-bottom: 1px solid var(--line); padding: 8px 0; }
.comment p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.comment .writer { color: var(--accent); }
.cdel { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .8rem; }
.cform { display: flex; gap: 6px; margin-top: 10px; }
.cform textarea { flex: 1; min-width: 0; }
.back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 0; margin-bottom: 6px; }
.err { color: var(--accent); font-size: .9rem; margin: 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 50; max-width: calc(100% - 32px); }
.login { text-align: center; padding: 48px 20px; }
.login p { color: var(--muted); line-height: 1.6; }

/* 급식 */
.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.datenav strong { font-size: 1.1rem; }
.meals { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.meal h3 { margin: 0 0 8px; font-size: 1rem; }
.meal ul { margin: 0; padding-left: 18px; line-height: 1.8; }
.meal .meta { margin-top: 8px; }

/* 시간표 */
.tt-wrap { overflow-x: auto; background: var(--card); border-radius: 12px; border: 1px solid var(--line); }
table.tt { border-collapse: collapse; width: 100%; min-width: 520px; font-size: .92rem; }
.tt th, .tt td { border-bottom: 1px solid var(--line); padding: 10px 6px; text-align: center; }
.tt th { background: var(--soft); font-weight: 700; }
.tt td.p { color: var(--muted); width: 44px; }
.tt .today { background: var(--study-bg); }

/* 행사 */
.ev { display: flex; gap: 12px; align-items: flex-start; }
.ev .day { flex-shrink: 0; width: 56px; text-align: center; background: var(--soft); border-radius: 10px; padding: 6px 0; }
.ev .day b { display: block; font-size: 1.3rem; }
.ev .day span { font-size: .75rem; color: var(--muted); }
.ev h3 { margin: 2px 0 4px; font-size: 1rem; }
.month-group { margin: 18px 0 8px; color: var(--muted); font-weight: 700; font-size: .9rem; }

/* 공부방 */
.rooms { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.room { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: left; cursor: pointer; }
.room h3 { margin: 0 0 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2fb35a; margin-right: 6px; vertical-align: middle; }
.dot.pause { background: #d9a520; }
.mytimer { text-align: center; padding: 24px 12px; }
.mytimer .clock { font-size: clamp(2.6rem, 12vw, 4rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.mytimer .ctrl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.member { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 8px; }
.member:last-child { border-bottom: 0; }
.member .name { min-width: 0; overflow-wrap: anywhere; }
.tmr { font-variant-numeric: tabular-nums; font-weight: 700; }
.rank { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.rank:last-child { border-bottom: 0; }
.rank .n { color: var(--muted); font-weight: 700; text-align: center; }
.studybar { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--study-bg); color: var(--study); padding: 8px 16px; font-weight: 600; font-size: .9rem; cursor: pointer; }
.focus { position: fixed; inset: 0; z-index: 40; background: #0e1116; color: #f2f4f8; display: grid; place-items: center; text-align: center; padding: 24px; }
.focus .clock { font-size: clamp(3.5rem, 18vw, 8rem); font-weight: 800; font-variant-numeric: tabular-nums; }
.focus p { color: #9aa3b2; }
.focus .ctrl { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
@media (prefers-reduced-motion: no-preference) { .focus .clock.run { animation: breathe 4s ease-in-out infinite; } }
@keyframes breathe { 50% { opacity: .82; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="box cafe">
      <div class="emblem">가림</div>
      <div>
        <div class="name" id="home">가림온</div>
        <div class="sub">가림고등학교 학생 커뮤니티</div>
      </div>
    </div>
    <div class="box me" id="meBox" hidden>
      <div class="who" id="meName"></div>
      <div class="mebtns">
        <button class="btn gray" data-go="me">내 프로필</button>
        <button class="btn ghost" id="logout">로그아웃</button>
      </div>
    </div>
    <nav class="box main" id="nav" hidden></nav>
    <div class="box studybar" id="studybar" hidden></div>
  </aside>
  <div class="content">
    <div class="boardhead" id="boardHead" hidden></div>
    <main id="app"><div class="empty">불러오는 중…</div></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="focus" id="focus" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, getDoc, getDocs, onSnapshot,
         query, orderBy, limit, where, serverTimestamp, writeBatch, increment }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getDatabase, ref as dbRef, set as dbSet, update as dbUpdate, remove as dbRemove, get as dbGet,
         onValue, onDisconnect, serverTimestamp as dbNow }

// 컬렉션은 그 탭을 처음 열 때 한 번만 구독 (읽기 횟수 아끼기)
const tabColl = () => tab === "lost" ? "posts" : tab === "event" ? "events" : isBoard(tab) ? tab : null;
function ensure(coll) {
  if (subs[coll]) return;
  subs[coll] = () => {};   // 구독 중복 방지 (아래에서 진짜 해제 함수로 바뀜)
  const toDocs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const refresh = () => { loaded[coll] = true; if (tabColl() === coll && (view === "list" || view === "detail")) render(); };
  if (coll === "events") {
    subs[coll] = onSnapshot(query(collection(fs, "events"), orderBy("date"), limit(200)),
      snap => { data.events = toDocs(snap); refresh(); }, fail);
    return;
  }
  // 최신 글 + 고정(공지) 글을 따로 받아서 합치기 → 오래된 공지도 항상 맨 위에
  const raw = { main: [], pin: [] };
  const merge = () => {
    const seen = new Set();
    data[coll] = [...raw.pin, ...raw.main]
      .filter(d => !seen.has(d.id) && seen.add(d.id))
      .sort((a, b) => (b.pinned === true) - (a.pinned === true) || tsOf(b) - tsOf(a));
    refresh();
  };
  const u1 = onSnapshot(query(collection(fs, coll), orderBy("createdAt", "desc"), limit(coll === "posts" ? 150 : 100)),
    snap => { raw.main = toDocs(snap); merge(); }, fail);
  const u2 = onSnapshot(query(collection(fs, coll), where("pinned", "==", true)),
    snap => { raw.pin = toDocs(snap); merge(); }, fail);
  subs[coll] = () => { u1(); u2(); };
}

  if (coll === "posts") items.push(`<button data-act="toggleResolved">${p.resolved ? "해결 취소하기" : "해결됨으로 표시"}</button>`);
  if (coll !== "events" && isAdmin()) {
    items.push(`<button data-act="pin">${p.pinned ? "📌 고정 해제" : "📌 맨 위에 고정"}</button>`);
    items.push(`<button data-act="color">🎨 제목 색 바꾸기</button>`);
    if (menuColor) items.push(`<div class="menucolors">
      <button data-act="setColor" data-color="">기본</button>
      ${Object.entries(TITLE_COLORS).map(([k, [n, c]]) => `<button data-act="setColor" data-color="${k}" style="color:${c}">${n}</button>`).join("")}
    </div>`);
  }
  if (coll !== "events") items.push(`<button data-act="open">글 열기</button>`);
  items.push(`<button data-act="delete" class="danger">${menuSure ? "정말 삭제할까요? 한 번 더 누르기" : "삭제"}</button>`);
  return `<div class="menu" role="menu">
    <div class="who">${mine ? "내 글" : "관리자 권한"}</div>${items.join("")}</div>`;
}
document.addEventListener("click", async e => {
  const moreBtn = e.target.closest("[data-menu]");
  const act = e.target.closest(".menu [data-act]");
  if (moreBtn) {
    e.stopPropagation();
    openMenuKey = openMenuKey === moreBtn.dataset.menu ? null : moreBtn.dataset.menu;
    menuSure = false; menuColor = false; render(); return;
  }
  if (act) {
    e.stopPropagation();
    const [coll, id] = openMenuKey.split("/");
    const p = data[coll].find(x => x.id === id);
    if (!p) { openMenuKey = null; return render(); }
    const a = act.dataset.act;
    if (a === "open") { openMenuKey = null; return openDetail(coll, id); }
    if (a === "color") { menuColor = !menuColor; return render(); }
    if (a === "pin" || a === "setColor") {
      openMenuKey = null; menuColor = false;
      const change = a === "pin" ? { pinned: !p.pinned } : { titleColor: act.dataset.color };
      try { await updateDoc(doc(fs, coll, id), change); toast(a === "pin" ? (p.pinned ? "고정을 풀었어요" : "맨 위에 고정했어요") : "제목 색을 바꿨어요"); }
      catch (err) { fail(err); }
      return render();
    }
    if (a === "toggleResolved") {
      openMenuKey = null;
      try { await updateDoc(doc(fs, coll, id), { resolved: !p.resolved }); toast(p.resolved ? "해결 표시를 취소했어요" : "해결됨으로 표시했어요"); }
      catch (err) { fail(err); }
      return render();
    }
    if (a === "delete") {
      if (!menuSure) { menuSure = true; return render(); }
      openMenuKey = null; menuSure = false;
      return deleteItem(coll, id);
    }
  }
  if (openMenuKey && !e.target.closest(".menu")) { openMenuKey = null; menuSure = false; menuColor = false; render(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && openMenuKey) { openMenuKey = null; render(); } });

async function deleteItem(coll, id) {
  try {
    const batch = writeBatch(fs);
    if (coll !== "events") {
      const cs = await getDocs(collection(fs, coll, id, "comments"));
      cs.forEach(c => batch.delete(c.ref));
    }
    batch.delete(doc(fs, coll, id));
    await batch.commit();
    toast("삭제했어요");
    if (view === "detail") { view = "list"; unsubComments?.(); unsubComments = null; }
    render();
  } catch (err) { fail(err); }
}

// 사진을 작게 줄여서 저장 (Firestore 글 하나는 1MB까지라서)
async function shrinkImage(file) {
  let source = await new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
  if (!source && window.createImageBitmap) {
    try { source = await createImageBitmap(file); } catch (e) { source = null; }
  }
  if (!source) return null;
  const w = source.naturalWidth || source.width, h = source.naturalHeight || source.height;
  if (!w || !h) return null;
  let max = 800, quality = 0.75, out = "";
  for (let i = 0; i < 5; i++) {
    const scale = Math.min(1, max / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(source, 0, 0, c.width, c.height);
    out = c.toDataURL("image/jpeg", quality);
    if (out.length <= 400000) break;
    max = Math.round(max * 0.8); quality = Math.max(0.5, quality - 0.1);
  }
  return out.startsWith("data:image/jpeg") && out.length <= 450000 ? out : null;
}

function openDetail(coll, id) {
  view = "detail"; currentColl = coll; currentId = id; comments = []; openMenuKey = null; replyTo = null;
  const key = coll + "/" + id;
  // 조회수: 다른 사람 글을 목록에서 열 때만, 같은 브라우저에서 한 글은 한 번만 (내 글은 세지 않음)
  const known = data[coll].find(x => x.id === id);
  viewed ??= new Set(store.get("viewed", []));
  if (known && known.uid !== me.uid && !viewed.has(key)) {
    viewed.add(key); store.set("viewed", [...viewed].slice(-500));
    updateDoc(doc(fs, coll, id), { viewCount: increment(1) }).catch(e => console.warn("조회수", e));
  }
  if (!(key in likedCache)) {
    likedCache[key] = false;
    getDoc(doc(fs, coll, id, "likes", me.uid))
      .then(d => { likedCache[key] = d.exists(); if (view === "detail" && currentId === id) renderDetail(); })
      .catch(e => console.warn("좋아요 확인", e));
  }
  unsubComments?.();
  unsubComments = onSnapshot(query(collection(fs, coll, id, "comments"), orderBy("createdAt")), snap => {
    comments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (view === "detail" && currentId === id) renderDetail();
  }, fail);
  render();
}

function renderDetail() {
  const coll = currentColl;
  const key = coll + "/" + currentId;
  const p = data[coll].find(x => x.id === currentId) || detailCache[key];
  if (!p) {
    // 최신 목록에 없는 오래된 글(내 프로필에서 연 글 등)은 따로 한 번 불러오기
    if (!(key in detailCache)) {
      detailCache[key] = false;   // false = 불러오는 중, null = 없음
      getDoc(doc(fs, coll, currentId)).then(d => {
        detailCache[key] = d.exists() ? { id: d.id, ...d.data() } : null;
        if (view === "detail" && currentColl + "/" + currentId === key) renderDetail();
      }).catch(fail);
    }
    app.innerHTML = `<button class="back" id="back">← 목록으로</button><div class="empty">${detailCache[key] === null ? "삭제되었거나 볼 수 없는 글이에요." : "불러오는 중…"}</div>`;
    $("back").onclick = () => { view = "list"; render(); }; return;
  }
  const mine = p.uid === me.uid;
  const nums = {}; let n = 0;
  comments.forEach(c => { if (c.uid !== p.uid) nums[c.uid] ??= ++n; });   // 처음 댓글 단 순서대로 익명1, 익명2…
  const nameOf = uid => uid === p.uid ? "글쓴이" : "익명" + nums[uid];
  const draft = $("cText")?.value || "";
  const rdraft = $("rText")?.value || "";
  const focusId = document.activeElement?.id;
  const liked = !!likedCache[key];
  // 댓글 묶기: 원댓글 + 그 아래 답글 (답글의 답글은 같은 원댓글 아래로)
  const tops = comments.filter(c => !c.parentId);
  const byParent = {};
  comments.filter(c => c.parentId).forEach(c => (byParent[c.parentId] ??= []).push(c));
  const goneParents = Object.keys(byParent).filter(pid => !tops.some(t => t.id === pid));
  const canDel = c => c.uid === me.uid || mine || isAdmin();
  const one = (c, isReply) => `
    <div class="comment">
      ${isReply ? `<span class="reply-mark" aria-hidden="true">↳</span>` : ""}<b class="${c.uid === p.uid ? "writer" : ""}">${nameOf(c.uid)}</b> <span class="meta">${fmt(c.createdAt)}</span>

        <button data-reply="${esc(isReply ? c.parentId : c.id)}">답글</button>

      </span>
      <p>${safe(c.text)}</p>
    </div>`;
  const replyForm = pid => replyTo === pid ? `
    <form class="rform" id="rForm">
      <textarea id="rText" rows="2" maxlength="500" placeholder="답글 남기기">${esc(rdraft)}</textarea>
      <button class="btn" id="rSubmit">등록</button>
      <button type="button" class="btn gray" id="rCancel">취소</button>
    </form>` : "";
  const thread = (top, pid) => `
    ${top}
    ${(byParent[pid] || []).length ? `<div class="replies">${byParent[pid].map(r => one(r, true)).join("")}</div>` : ""}

        <dt>종류</dt><dd>${esc(p.category)}</dd>
        <dt>장소</dt><dd>${safe(p.location)}</dd>

        ${p.storage ? `<dt>보관 위치</dt><dd>${safe(p.storage)}</dd>` : ""}

      ${p.description ? `<p class="desc">${safe(p.description)}</p>` : ""}` : `
      ${pinBadge(p)}
      <h2${titleStyle(p)}>${safe(p.title)}</h2>
      <p class="meta">${writer(p)}${mine ? " (내 글)" : ""} · ${fmt(p.createdAt)}</p>
      <p class="desc">${safe(p.body)}</p>
      ${safeImg(p.image) ? `<img class="photo" src="${safeImg(p.image)}" alt="">` : ""}`;

  app.innerHTML = `
    <button class="back" id="back">← 목록으로</button>
    <article class="panel">
      ${body}
      <div class="stats">
        <button class="likebtn ${liked ? "on" : ""}" id="likeBtn" aria-pressed="${liked}"><span class="h" aria-hidden="true">${liked ? "♥" : "♡"}</span>좋아요 ${Number(p.likeCount) || 0}</button>
        <span class="meta">조회 ${Number(p.viewCount) || 0}</span>
      </div>
      ${mine || isAdmin() ? `
      <div class="owner">
        ${coll === "posts" ? `<button class="btn" id="resolve">${p.resolved ? "해결 취소" : "찾았어요 (해결 처리)"}</button>` : ""}
        ${isAdmin() ? `<button class="btn gray" id="pinBtn">${p.pinned ? "📌 고정 해제" : "📌 맨 위에 고정"}</button>` : ""}

      </div>` : ""}
    </article>
    <section class="panel">
      <h3>댓글 ${comments.length}</h3>
      ${tops.map(c => thread(one(c, false), c.id)).join("")}
      ${goneParents.map(pid => thread(`<div class="comment gone"><p>삭제된 댓글이에요.</p></div>`, pid)).join("")}
      <form class="cform" id="cForm">
        <textarea id="cText" rows="2" maxlength="500" placeholder="댓글 남기기">${esc(draft)}</textarea>
        <button class="btn" id="cSubmit">등록</button>
      </form>

  $("back").onclick = () => { view = "list"; unsubComments?.(); unsubComments = null; render(); };
  const postRef = doc(fs, coll, p.id);
  $("resolve")?.addEventListener("click", () =>
    updateDoc(postRef, { resolved: !p.resolved }).then(() => { delete detailCache[key]; toast(p.resolved ? "해결 표시를 취소했어요" : "해결됨으로 표시했어요 🎉"); renderDetail(); }).catch(fail));
  $("pinBtn")?.addEventListener("click", () =>
    updateDoc(postRef, { pinned: !p.pinned }).then(() => { delete detailCache[key]; toast(p.pinned ? "고정을 풀었어요" : "맨 위에 고정했어요"); renderDetail(); }).catch(fail));
  $("del")?.addEventListener("click", e => {

    if (btn.dataset.sure !== "1") { btn.dataset.sure = "1"; btn.textContent = "정말 삭제할까요? 한 번 더 누르기"; return; }
    btn.disabled = true; deleteItem(coll, p.id);
  });
  app.querySelectorAll(".cdel").forEach(b => b.onclick = () =>
    deleteDoc(doc(fs, coll, p.id, "comments", b.dataset.cid)).catch(fail));
  // 좋아요: likes/{내 uid} 문서 + 글의 likeCount 를 함께 바꿈 (한 사람 한 번)
  $("likeBtn").onclick = async () => {

      if (was) batch.delete(likeRef); else batch.set(likeRef, { createdAt: serverTimestamp() });
      batch.update(postRef, { likeCount: increment(was ? -1 : 1) });
      await batch.commit();
      likedCache[key] = !was;
      if (detailCache[key]) detailCache[key] = { ...detailCache[key], likeCount: (Number(detailCache[key].likeCount) || 0) + (was ? -1 : 1) };
    } catch (err) { fail(err); }

  };

  app.querySelectorAll("[data-reply]").forEach(b => b.onclick = () => {

    $("rSubmit").disabled = true;
    try {
      const batch = writeBatch(fs);
      batch.set(doc(collection(fs, coll, p.id, "comments")), { text, uid: me.uid, createdAt: serverTimestamp(), parentId: replyTo });
      batch.update(postRef, { commentCount: increment(1) });
      await batch.commit();

  if (focusId && $(focusId) && /^(cText|rText)$/.test(focusId)) { const el = $(focusId); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  $("cForm").onsubmit = async e => {
    e.preventDefault();
    const text = $("cText").value.trim();
    if (!text) return;
    $("cSubmit").disabled = true;
    try {
      const batch = writeBatch(fs);
      batch.set(doc(collection(fs, coll, p.id, "comments")), { text, uid: me.uid, createdAt: serverTimestamp() });

      await batch.commit();
      $("cText").value = "";

    if ($("cSubmit")) $("cSubmit").disabled = false;
  };
}

//  내 프로필 (보여질 이름 · 설정 · 내가 쓴 글)

// =====================================================================
const NAME_RULE = /^[가-힣a-zA-Z0-9_]{2,12}$/;
async function loadMyProfile() {
  try {
    const d = await getDoc(doc(fs, "users", me.uid));
    myName = d.exists() ? (d.data().name || "") : "";
  } catch (e) { console.warn("프로필을 불러오지 못했어요", e); }
  updateMeBox();
}
function updateMeBox() {
  if (!me) return;
  $("meName").innerHTML = `<b>${esc(myName || (isAdmin() ? "운영자" : "가림고 학생"))}</b>${isAdmin() ? ` <span class="badge club">관리자</span>` : ""}`;
}
async function saveName(name) {
  if (!NAME_RULE.test(name)) throw new Error("한글, 영문, 숫자, _ 로 2~12자까지 쓸 수 있어요. 띄어쓰기는 안 돼요.");
  if (name === myName) return;
  const batch = writeBatch(fs);
  const sameKey = myName && myName.toLowerCase() === name.toLowerCase();
  if (!sameKey) {
    batch.set(doc(fs, "names", name.toLowerCase()), { uid: me.uid });
    if (myName) batch.delete(doc(fs, "names", myName.toLowerCase()));
  }
  batch.set(doc(fs, "users", me.uid), { name, updatedAt: serverTimestamp() });
  try { await batch.commit(); }
  catch (e) {
    if ((e?.code || "").includes("permission")) throw new Error("이미 다른 사람이 쓰는 이름이에요. 다른 이름을 골라주세요.");
    throw e;
  }
  myName = name; updateMeBox();
}

// =====================================================================
//  나이스 API (급식 · 시간표 · 학사일정)
// =====================================================================
const neisCache = {};
async function schoolCodes() {
  if (SCHOOL_CODE) return { office: OFFICE_CODE, school: SCHOOL_CODE };
  const saved = store.get("neisSchool", null);
  if (saved?.name === SCHOOL_NAME) return saved;
  const rows = await neisRaw("schoolInfo", { ATPT_OFCDC_SC_CODE: OFFICE_CODE, SCHUL_NM: SCHOOL_NAME });
  const hit = rows.find(r => r.SCHUL_NM === SCHOOL_NAME) || rows[0];
  if (!hit) throw new Error(`나이스에서 '${SCHOOL_NAME}'을(를) 찾지 못했어요.`);
  const codes = { name: SCHOOL_NAME, office: hit.ATPT_OFCDC_SC_CODE, school: hit.SD_SCHUL_CODE };
  store.set("neisSchool", codes);
  return codes;
}
async function neisRaw(endpoint, params) {
  const u = new URL("https://open.neis.go.kr/hub/" + endpoint);
  const p = { Type: "json", pIndex: 1, pSize: NEIS_KEY ? 100 : 5, ...params };
  if (NEIS_KEY) p.KEY = NEIS_KEY;
  Object.entries(p).forEach(([k, v]) => u.searchParams.set(k, v));
  const key = u.toString();
  if (neisCache[key]) return neisCache[key];
  let res;
  try { res = await fetch(u); } catch (e) { throw new Error("나이스 서버에 연결하지 못했어요. 인터넷 연결을 확인하거나 잠시 후 다시 시도해주세요."); }
  const j = await res.json();
  const body = j[endpoint];
  if (!body) {
    const code = j.RESULT?.CODE || "";
    if (code === "INFO-200") return (neisCache[key] = []);   // 해당 데이터 없음
    throw new Error("나이스: " + (j.RESULT?.MESSAGE || "알 수 없는 오류"));
  }
  return (neisCache[key] = body[1]?.row || []);
}
async function neis(endpoint, params) {
  const c = await schoolCodes();
  return neisRaw(endpoint, { ATPT_OFCDC_SC_CODE: c.office, SD_SCHUL_CODE: c.school, ...params });
}

        <tbody>${[...Array(maxP)].map((_, i) => `<tr><td class="p">${i + 1}</td>${days.map(d =>
          `<td class="${ymd(d) === todayKey ? "today" : ""}">${esc(grid[ymd(d)]?.[i + 1] || "")}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>` : `<div class="empty">이 주의 시간표가 없어요.<br>방학이거나 아직 나이스에 등록되지 않았을 수 있어요.</div>`;
  } catch (e) {
    if ($("ttBody")) $("ttBody").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

// ----- 행사 -----
let evMonth = new Date();
async function renderEvents() {
  ensure("events");
  const m = new Date(evMonth.getFullYear(), evMonth.getMonth(), 1);
  const mEnd = new Date(m.getFullYear(), m.getMonth() + 1, 0);
  const inMonth = data.events.filter(e => e.date >= dash(m) && e.date <= dash(mEnd));
  app.innerHTML = `
    <div class="datenav">
      <button class="btn gray" id="prevM">◀</button>
      <strong>${m.getFullYear()}년 ${m.getMonth() + 1}월 학교 행사</strong>
      <button class="btn gray" id="nextM">▶</button>
    </div>
    <div id="evBody"><div class="empty">불러오는 중…</div></div>
    ${isAdmin() ? `<p class="meta" style="margin-top:8px">관리자는 오른쪽 위 「+ 행사 등록」으로 행사를 올릴 수 있어요.</p>` : ""}`;
  $("prevM").onclick = () => { evMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); render(); };
  $("nextM").onclick = () => { evMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); render(); };

  let neisRows = [], neisErr = "";
  try {
    neisRows = (await neis("SchoolSchedule", { AA_FROM_YMD: ymd(m), AA_TO_YMD: ymd(mEnd) }))
      .filter(r => r.EVENT_NM && !/토요휴업일/.test(r.EVENT_NM));
  } catch (e) { neisErr = e.message; }
  if (tab !== "event" || view !== "list") return;
  const items = [
    ...inMonth.map(e => ({ date: e.date, title: e.title, place: e.place, desc: e.description, src: "club", ev: e })),
    ...neisRows.map(r => ({ date: `${r.AA_YMD.slice(0, 4)}-${r.AA_YMD.slice(4, 6)}-${r.AA_YMD.slice(6)}`, title: r.EVENT_NM, src: "school" })),
  ].sort((a, b) => a.date.localeCompare(b.date));
  $("evBody").innerHTML = (items.length ? `<div class="list">${items.map(it => {
    const d = new Date(it.date + "T00:00");
    return `<div class="cardwrap"><div class="panel ev" style="margin:0;${it.ev && canManage(it.ev) ? "padding-right:48px" : ""}">
      <div class="day"><b>${d.getDate()}</b><span>${WEEK[d.getDay()]}요일</span></div>
      <div style="min-width:0;flex:1">
        <span class="badge ${it.src}">${it.src === "school" ? "학사일정" : "학교 행사"}</span>
        <h3>${esc(it.title)}</h3>
        ${it.place ? `<p class="meta">📍 ${esc(it.place)}</p>` : ""}
        ${it.desc ? `<p class="desc" style="margin:6px 0 0">${esc(it.desc)}</p>` : ""}
      </div></div>
      ${it.ev ? moreButton("events", it.ev) : ""}</div>`;
  }).join("")}</div>` : `<div class="empty">이 달에 등록된 행사가 없어요.</div>`)
    + (neisErr ? `<p class="meta" style="margin-top:8px">학사일정을 불러오지 못했어요: ${esc(neisErr)}</p>` : "");
}

function renderEventWrite() {
  if (!isAdmin()) { view = "list"; return render(); }
  app.innerHTML = `
    <button class="back" id="back">← 행사로</button>
    <h2>행사 등록</h2>
    <form class="panel write" id="wForm">
      <label>행사 이름 *<input id="eTitle" maxlength="60" placeholder="예: 가림 축제, 동아리 발표회"></label>
      <div class="row">
        <label>날짜 *<input type="date" id="eDate" value="${dash(new Date())}"></label>
        <label>장소<input id="ePlace" maxlength="40" placeholder="예: 체육관"></label>
      </div>
      <label>설명<textarea id="eDesc" rows="5" maxlength="1000" placeholder="시간, 준비물, 신청 방법 등"></textarea></label>
      <p class="err" id="wErr" hidden></p>
      <button class="btn big" id="wSubmit">등록하기</button>
    </form>`;
  $("back").onclick = () => { view = "list"; render(); };
  $("wForm").onsubmit = async e => {
    e.preventDefault();
    const title = $("eTitle").value.trim(), date = $("eDate").value;
    if (!title || !date) return showErr("행사 이름과 날짜를 입력해주세요.");
    await submit(async () => {
      await addDoc(collection(fs, "events"), {
        title, date, place: $("ePlace").value.trim(), description: $("eDesc").value.trim(),
        uid: me.uid, createdAt: serverTimestamp(),
      });
      evMonth = new Date(date + "T00:00"); view = "list"; render();
    });
  };
}

// =====================================================================
//  공부방 (열품타 + 디스코드 느낌) — Realtime Database
// =====================================================================
let serverOffset = 0;
let roomsData = {}, totalsData = {}, totalsDay = "";
let study = { room: null, status: null, startedAt: 0, base: 0, nickname: "" };
let studyWatching = false, saveTimer = null, autoPausedNotice = false;
let myRoomRef = null;
const todayKey = () => ymd(new Date());
const myElapsed = () => study.status === "studying"
  ? study.base + Math.max(0, (Date.now() + serverOffset - study.startedAt) / 1000) : study.base;
const memberElapsed = m => m.status === "studying" && m.startedAt
  ? (m.base || 0) + Math.max(0, (Date.now() + serverOffset - m.startedAt) / 1000) : (m.base || 0);

function startStudyWatch() {
  if (!rtdb || studyWatching) return;
  studyWatching = true;
  onValue(dbRef(rtdb, ".info/serverTimeOffset"), s => { serverOffset = s.val() || 0; });
  onValue(dbRef(rtdb, "rooms"), s => { roomsData = s.val() || {}; if (tab === "study") renderStudy(); },
    e => { console.warn(e); roomsData = {}; });
  // 연결이 끊겼다 다시 붙으면 공부방에 다시 들어가기
  onValue(dbRef(rtdb, ".info/connected"), s => { if (s.val() && study.room && me) writePresence().catch(console.warn); });
}
function watchTotals() {
  const day = todayKey();
  if (totalsDay === day) return;
  totalsDay = day;
  onValue(dbRef(rtdb, "totals/" + day), s => { totalsData = s.val() || {}; if (tab === "study") renderStudy(); }, console.warn);
}
async function writePresence() {
  myRoomRef = dbRef(rtdb, `rooms/${study.room}/${me.uid}`);
  await onDisconnect(myRoomRef).remove();
  await dbSet(myRoomRef, {
    nickname: study.nickname, status: study.status,
    startedAt: study.status === "studying" ? dbNow() : 0, base: Math.floor(study.base),
  });
  if (study.status === "studying") study.startedAt = Date.now() + serverOffset;
}
async function saveTotal() {
  if (!study.room) return;
  await dbSet(dbRef(rtdb, `totals/${todayKey()}/${me.uid}`), { nickname: study.nickname, seconds: Math.min(86400, Math.floor(myElapsed())) });
}

async function enterRoom(roomId) {
  if (!rtdb) return toast("공부방 데이터베이스가 아직 설정되지 않았어요.");
  const nickname = ($("nick")?.value || store.get("nick", "")).trim();
  if (!nickname) { toast("공부방에서 쓸 닉네임을 먼저 정해주세요."); $("nick")?.focus(); return; }
  store.set("nick", nickname);
  try {
    if (study.room && study.room !== roomId) await leaveRoom();
    const t = await dbGet(dbRef(rtdb, `totals/${todayKey()}/${me.uid}`));
    study = { room: roomId, status: "paused", startedAt: 0, base: t.val()?.seconds || 0, nickname };
    await writePresence();
    renderStudy();
  } catch (e) { study.room = null; fail(e); }
}
async function startStudy() {
  if (!study.room) return;
  study.status = "studying"; study.startedAt = Date.now() + serverOffset;
  try {
    await dbUpdate(myRoomRef, { status: "studying", startedAt: dbNow(), base: Math.floor(study.base) });
    clearInterval(saveTimer); saveTimer = setInterval(() => saveTotal().catch(console.warn), 60000);
  } catch (e) { fail(e); }
  renderStudy(); renderFocus();
}
async function pauseStudy() {
  if (!study.room || study.status !== "studying") return;
  study.base = myElapsed(); study.status = "paused";
  clearInterval(saveTimer);
  try {
    await dbUpdate(myRoomRef, { status: "paused", startedAt: 0, base: Math.floor(study.base) });
    await saveTotal();
  } catch (e) { fail(e); }
  renderStudy(); renderFocus();
}
async function leaveRoom() {
  if (!study.room || !rtdb) return;
  try {
    if (study.status === "studying") { study.base = myElapsed(); study.status = "paused"; }
    clearInterval(saveTimer);
    await saveTotal();
    if (myRoomRef) { await onDisconnect(myRoomRef).cancel(); await dbRemove(myRoomRef); }
  } catch (e) { console.warn(e); }
  study = { room: null, status: null, startedAt: 0, base: 0, nickname: study.nickname };
  myRoomRef = null;
  $("focus").hidden = true;
  if (tab === "study") renderStudy();
}

// 열품타처럼: 공부 중에 다른 앱/탭으로 나가면 자동 일시정지
document.addEventListener("visibilitychange", () => {
  if (document.hidden && study.status === "studying" && store.get("autoPause", true)) { pauseStudy(); autoPausedNotice = true; }
  else if (!document.hidden && autoPausedNotice) { autoPausedNotice = false; toast("화면을 나가서 일시정지됐어요. 다시 「공부 시작」을 눌러주세요."); }
});

function roomMembers(id) {
  return Object.entries(roomsData[id] || {}).map(([uid, m]) => ({ uid, ...m }))
    .sort((a, b) => (b.status === "studying") - (a.status === "studying") || memberElapsed(b) - memberElapsed(a));
}

function renderStudy() {
  updateStudybar();
  if (tab !== "study" || !me) return;
  if (!rtdb) { app.innerHTML = `<div class="empty">공부방 데이터베이스 주소(databaseURL)를 설정해주세요.</div>`; return; }
  watchTotals();
  const active = document.activeElement?.id;
  if (!study.room) {
    app.innerHTML = `
      <div class="panel">
        <label class="write" style="display:grid;gap:4px;font-weight:600">공부방 닉네임
          <input id="nick" maxlength="12" value="${esc(store.get("nick", ""))}" placeholder="다른 사람에게 보이는 이름 (실명 말고 별명 추천)">
        </label>
        <label class="check" style="margin-top:10px"><input type="checkbox" id="autoPause" ${store.get("autoPause", true) ? "checked" : ""}> 공부 중에 화면을 나가면 자동으로 일시정지 (열품타 모드)</label>
      </div>
      <div class="rooms">${STUDY_ROOMS.map(r => {
        const ms = roomMembers(r.id), on = ms.filter(m => m.status === "studying").length;
        return `<button class="room" data-room="${r.id}">
          <h3>${esc(r.name)}</h3>
          <p class="meta"><span class="dot"></span>공부 중 ${on}명 · 입장 ${ms.length}명</p>
        </button>`;
      }).join("")}</div>
      ${rankingHtml()}`;
    app.querySelectorAll("[data-room]").forEach(b => b.onclick = () => enterRoom(b.dataset.room));
    $("autoPause").onchange = e => store.set("autoPause", e.target.checked);
    $("nick").oninput = e => store.set("nick", e.target.value.trim());
    if (active === "nick") { const el = $("nick"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    return;
  }
  const room = STUDY_ROOMS.find(r => r.id === study.room) || { name: study.room };
  const ms = roomMembers(study.room);
  app.innerHTML = `
    <button class="back" id="leave">← 공부방 나가기</button>
    <div class="panel mytimer">
      <p class="meta">${esc(room.name)} · ${esc(study.nickname)} · 오늘 공부한 시간</p>
      <div class="clock" data-me>${hms(myElapsed())}</div>
      <div class="ctrl">
        ${study.status === "studying"
          ? `<button class="btn gray" id="pause">⏸ 일시정지</button>`
          : `<button class="btn blue" id="start">▶ 공부 시작</button>`}
        <button class="btn gray" id="focusBtn">집중 모드</button>
      </div>
    </div>
    <section class="panel">
      <h3 style="margin-top:0">지금 이 방에 있는 사람 ${ms.length}명</h3>
      ${ms.length ? ms.map(m => `
        <div class="member">
          <span class="name"><span class="dot ${m.status === "studying" ? "" : "pause"}"></span>${safe(m.nickname)}${m.uid === me.uid ? " (나)" : ""}
            <span class="meta">${m.status === "studying" ? "공부 중" : "쉬는 중"}</span></span>
          <span class="tmr" data-uid="${esc(m.uid)}">${hms(memberElapsed(m))}</span>
        </div>`).join("") : `<p class="meta">아직 아무도 없어요.</p>`}
    </section>
    ${rankingHtml()}`;
  $("leave").onclick = leaveRoom;
  $("start")?.addEventListener("click", startStudy);
  $("pause")?.addEventListener("click", pauseStudy);
  $("focusBtn").onclick = () => { $("focus").hidden = false; renderFocus(); document.documentElement.requestFullscreen?.().catch(() => {}); };
}

function rankingHtml() {
  // 오늘 기록 + 지금 공부 중인 사람의 실시간 시간 합치기
  const best = {};
  Object.entries(totalsData).forEach(([uid, t]) => best[uid] = { nickname: t.nickname, sec: t.seconds || 0 });
  Object.values(roomsData).forEach(r => Object.entries(r || {}).forEach(([uid, m]) => {
    const s = memberElapsed(m); if (!best[uid] || s > best[uid].sec) best[uid] = { nickname: m.nickname, sec: s };
  }));
  const list = Object.entries(best).sort((a, b) => b[1].sec - a[1].sec).slice(0, 10);
  return `<section class="panel"><h3 style="margin-top:0">오늘의 공부 랭킹</h3>
    ${list.length ? list.map(([uid, b], i) => `<div class="rank"><span class="n">${i + 1}</span>
      <span>${safe(b.nickname)}${uid === me.uid ? " (나)" : ""}</span><span class="tmr" data-rank="${esc(uid)}">${hms(b.sec)}</span></div>`).join("")
      : `<p class="meta">오늘 아직 기록이 없어요. 첫 번째로 공부를 시작해보세요!</p>`}</section>`;
}

function renderFocus() {
  const f = $("focus");
  if (f.hidden) return;
  if (!study.room) { f.hidden = true; return; }
  const room = STUDY_ROOMS.find(r => r.id === study.room) || { name: "" };
  const on = roomMembers(study.room).filter(m => m.status === "studying").length;
  f.innerHTML = `<div>
    <p>${esc(room.name)} · 지금 ${on}명이 같이 공부 중</p>
    <div class="clock ${study.status === "studying" ? "run" : ""}" data-me>${hms(myElapsed())}</div>
    <p>${study.status === "studying" ? "집중하는 중이에요. 화면을 나가면 일시정지돼요." : "일시정지 중"}</p>
    <div class="ctrl">
      ${study.status === "studying" ? `<button class="btn gray" id="fPause">⏸ 일시정지</button>` : `<button class="btn blue" id="fStart">▶ 공부 시작</button>`}
      <button class="btn gray" id="fExit">집중 모드 끄기</button>
    </div></div>`;
  $("fPause")?.addEventListener("click", pauseStudy);
  $("fStart")?.addEventListener("click", startStudy);
  $("fExit").onclick = () => { f.hidden = true; document.fullscreenElement && document.exitFullscreen?.().catch(() => {}); };
}

function updateStudybar() {
  const bar = $("studybar");
  if (!study.room || tab === "study") { bar.hidden = true; return; }
  const room = STUDY_ROOMS.find(r => r.id === study.room) || { name: "" };
  bar.hidden = false;
  bar.innerHTML = `<span>${study.status === "studying" ? "📖 공부 중" : "⏸ 쉬는 중"} · ${esc(room.name)}</span><span class="tmr" data-me>${hms(myElapsed())}</span>`;
}
$("studybar").onclick = () => go("study");

// 1초마다 타이머 숫자만 바꾸기 (화면 전체를 다시 그리지 않음)
setInterval(() => {
  document.querySelectorAll("[data-me]").forEach(el => el.textContent = hms(myElapsed()));
  document.querySelectorAll(".tmr[data-uid]").forEach(el => {
    const m = roomsData[study.room]?.[el.dataset.uid]; if (m) el.textContent = hms(memberElapsed(m));
  });
  if (todayKey() !== totalsDay && tab === "study") renderStudy();   // 자정이 지나면 오늘 기록 새로
}, 1000);
</script>
