<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리학교 분실물 게시판</title>
<!--
  학교 분실물 게시판 - Firebase 온라인 버전
  - 구글 로그인 + Firestore에 저장 → 모든 사람이 같은 글을 봄
  - 주의: 파일을 더블클릭해서 열면 로그인이 안 돼요. 웹에 올려서(GitHub Pages 등) 주소로 접속해야 해요.
-->
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --fg: #222; --muted: #888; --line: #e6e6e6;
  --accent: #c62917; --lost-bg: #ffe3e0; --found-bg: #dff3e4; --found-fg: #1d7a3a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16171a; --card: #22242a; --fg: #eee; --muted: #9a9a9a; --line: #33363d;
          --accent: #ff6b57; --lost-bg: #4a2420; --found-bg: #1f3d29; --found-fg: #7fd69a; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--fg); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.logo { font-weight: 800; font-size: 1.2rem; color: var(--accent); cursor: pointer; }
.hbtns { display: flex; gap: 6px; align-items: center; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.big { width: 100%; padding: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button { padding: 8px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
.tabs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.filters #q { flex: 1 1 200px; }
.check { font-size: .9rem; display: flex; gap: 4px; align-items: center; }
.list { display: grid; gap: 10px; }
.card { display: flex; gap: 12px; background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
.card.done { opacity: .55; }
.thumb { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--bg); display: grid; place-items: center; font-size: 2rem; }
.card h3 { margin: 6px 0 4px; font-size: 1.05rem; }
.meta { color: var(--muted); font-size: .85rem; margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 40px; background: var(--card); border-radius: 12px; }
.badge { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 6px; font-weight: 700; margin-right: 4px; }
.badge.lost { background: var(--lost-bg); color: var(--accent); }
.badge.found { background: var(--found-bg); color: var(--found-fg); }
.badge.resolved { background: var(--line); color: var(--muted); }
.panel { background: var(--card); padding: 18px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--line); }
.write { display: grid; gap: 12px; }
.write label { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kind-pick { display: flex; gap: 16px; }
.kind-pick label { display: flex; gap: 6px; align-items: center; font-weight: 600; }
.photo { width: 100%; max-height: 420px; object-fit: contain; background: var(--bg); border-radius: 10px; margin: 12px 0; }
dl { display: grid; grid-template-columns: 80px 1fr; gap: 6px 10px; }
dt { color: var(--muted); } dd { margin: 0; }
.desc { white-space: pre-wrap; line-height: 1.6; }
.owner { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.comment { border-bottom: 1px solid var(--line); padding: 8px 0; }
.comment p { margin: 4px 0 0; white-space: pre-wrap; }
.comment .writer { color: var(--accent); }
.cdel { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .8rem; }
.cform { display: flex; gap: 6px; margin-top: 10px; }
.cform textarea { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; }
.back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 0; }
.err { color: var(--accent); font-size: .9rem; margin: 0; }
.login { text-align: center; padding: 48px 20px; }
.login h2 { margin-top: 0; }
.login p { color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<header>
  <span class="logo" id="home">🔎 분실물 게시판</span>
  <div class="hbtns">
    <button class="btn" id="goWrite" hidden>+ 글쓰기</button>
    <button class="btn ghost" id="logout" hidden>로그아웃</button>
  </div>
</header>
<main id="app"><div class="empty">불러오는 중…</div></main>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, getDocs, onSnapshot,
         query, orderBy, limit, serverTimestamp, writeBatch, increment }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ===== Firebase 설정 (Firebase 콘솔에서 받은 값) =====
const firebaseConfig = {
  apiKey: "AIzaSyBPGc5RN5j-V4DwPzKHdI-WzDM6LE45jNU",
  authDomain: "everttime-e595f.firebaseapp.com",
  projectId: "everttime-e595f",
  storageBucket: "everttime-e595f.firebasestorage.app",
  messagingSenderId: "998168532418",
  appId: "1:998168532418:web:69dfb070b9f7742b88325b",
};

// ===== 학교에 맞게 바꿔서 쓰세요 =====
// 학교 계정만 받기: 이메일이 ALLOWED_PREFIX 로 시작하고 @ALLOWED_DOMAIN 으로 끝나야 로그인 가능
// gclass.ice.go.kr 은 인천 전체 학교가 같이 쓰는 도메인이라, 우리 학교 앞부분(kko58-)까지 확인해요.
// ※ 보안 규칙(firestore.rules)에도 같은 조건을 적어야 진짜로 막혀요.
const ALLOWED_DOMAIN = "gclass.ice.go.kr";
const ALLOWED_PREFIX = "kko58-";
// 관리자(선생님, 학생회 등) 이메일 → 남의 글도 삭제 가능. 보안 규칙에도 같은 이메일을 적으세요.
const ADMIN_EMAILS = ["jaung0622@gmail.com"];
const CATEGORIES = ["전자기기", "필기구", "의류", "지갑/카드", "책/노트", "물병/텀블러", "기타"];
const LOCATIONS  = ["교실", "복도", "체육관", "운동장", "급식실", "도서관", "화장실", "기타"];

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const fs = getFirestore(fb);
const postsCol = collection(fs, "posts");

let me = null;          // 로그인한 사용자
let posts = [];         // 실시간으로 받아온 글 목록
let view = "list";      // 지금 보고 있는 화면
let currentId = null;   // 상세 화면의 글 id
let comments = [];
let unsubPosts = null, unsubComments = null;
let filter = { kind: "", q: "", category: "", location: "", showResolved: false };

const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeImg = s => typeof s === "string" && s.startsWith("data:image/") ? esc(s) : "";
const kindLabel = k => k === "lost" ? "잃어버렸어요" : "주웠어요";
const ADMINS = ADMIN_EMAILS.map(e => String(e).trim().toLowerCase());
const isAdmin = () => !!me && ADMINS.includes((me.email || "").toLowerCase());
const fmt = ts => {
  if (!ts?.toDate) return "방금";
  const d = ts.toDate(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const options = (list, sel, first) => (first ? `<option value="">${first}</option>` : "") +
  list.map(v => `<option ${v === sel ? "selected" : ""}>${v}</option>`).join("");

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.hidden = true, 2500);
}
function fail(e) {
  console.error(e);
  toast(e?.code === "permission-denied" ? "권한이 없어요. 로그인 상태나 보안 규칙을 확인해주세요." : "오류가 났어요: " + (e?.message || e));
}

// ===== 로그인 =====
const provider = new GoogleAuthProvider();
// 항상 계정 선택 창을 보여줌 (학교 계정인지는 로그인 후에 확인 + 보안 규칙에서 막음)
// ※ hd(도메인 힌트)를 넣으면 교육청 로그인(SAML)으로 강제로 넘어가 500 오류가 나서 쓰지 않아요.
provider.setCustomParameters({ prompt: "select_account" });

onAuthStateChanged(auth, user => {
  const email = (user?.email || "").toLowerCase();
  const isSchool = email.startsWith(ALLOWED_PREFIX) && email.endsWith("@" + ALLOWED_DOMAIN);
  if (user && ALLOWED_DOMAIN && !isSchool && !ADMINS.includes(email)) {
    toast("우리 학교 계정(" + ALLOWED_PREFIX + "…@" + ALLOWED_DOMAIN + ")으로만 로그인할 수 있어요.");
    signOut(auth); return;
  }
  me = user;
  $("goWrite").hidden = !user;
  $("logout").hidden = !user;
  if (!user) {
    unsubPosts?.(); unsubPosts = null; unsubComments?.(); unsubComments = null;
    return renderLogin();
  }
  if (!unsubPosts) {
    unsubPosts = onSnapshot(query(postsCol, orderBy("createdAt", "desc"), limit(300)), snap => {
      posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (view === "list") renderList();
      if (view === "detail") renderDetail();
    }, fail);
  }
  renderList();
});

function renderLogin() {
  view = "login";
  app.innerHTML = `
    <div class="panel login">
      <h2>우리학교 분실물 게시판</h2>
      <p>잃어버린 물건, 주운 물건을 올리고 찾아요.<br>
      ${ALLOWED_DOMAIN ? `학교 구글 계정(${esc(ALLOWED_PREFIX)}…@${esc(ALLOWED_DOMAIN)})으로 로그인해주세요.` : "구글 계정으로 로그인해주세요."}<br>
      게시판에는 익명으로 표시돼요.</p>
      <button class="btn big" id="loginBtn">구글로 로그인</button>
      ${location.protocol === "file:" ? `<p class="err" style="margin-top:12px">지금은 파일로 열려 있어서 로그인이 안 돼요. 웹에 올린 주소로 접속해주세요.</p>` : ""}
    </div>`;
  $("loginBtn").onclick = () => signInWithPopup(auth, provider).catch(e => {
    if (e.code === "auth/unauthorized-domain") toast("이 주소가 Firebase 승인된 도메인에 없어요. Authentication 설정에서 추가해주세요.");
    else if (e.code !== "auth/popup-closed-by-user") fail(e);
  });
}

// ===== 화면 1: 목록 =====
function renderList() {
  view = "list"; unsubComments?.(); unsubComments = null;
  const q = filter.q.trim().toLowerCase();
  const shown = posts
    .filter(p => !filter.kind || p.kind === filter.kind)
    .filter(p => !filter.category || p.category === filter.category)
    .filter(p => !filter.location || p.location === filter.location)
    .filter(p => filter.showResolved || !p.resolved)
    .filter(p => !q || (p.title + " " + p.description).toLowerCase().includes(q));

  app.innerHTML = `
    <nav class="tabs">
      ${[["", "전체"], ["lost", "잃어버렸어요"], ["found", "주웠어요"]].map(([k, l]) =>
        `<button data-kind="${k}" class="${filter.kind === k ? "on" : ""}">${l}</button>`).join("")}
    </nav>
    <div class="filters">
      <input id="q" placeholder="검색 (예: 이어폰, 검정 필통)" value="${esc(filter.q)}">
      <select id="fCat">${options(CATEGORIES, filter.category, "종류 전체")}</select>
      <select id="fLoc">${options(LOCATIONS, filter.location, "장소 전체")}</select>
      <label class="check"><input type="checkbox" id="fRes" ${filter.showResolved ? "checked" : ""}> 해결된 글 포함</label>
    </div>
    <div class="list">
      ${shown.length ? shown.map(p => `
        <button class="card ${p.resolved ? "done" : ""}" data-id="${esc(p.id)}">
          ${safeImg(p.image) ? `<img class="thumb" src="${safeImg(p.image)}" alt="">` : `<div class="thumb">📦</div>`}
          <div>
            <span class="badge ${p.kind === "lost" ? "lost" : "found"}">${kindLabel(p.kind)}</span>${p.resolved ? `<span class="badge resolved">해결됨</span>` : ""}
            <h3>${esc(p.title)}</h3>
            <p class="meta">${esc(p.category)} · ${esc(p.location)} · ${esc(p.date)} · 💬 ${Number(p.commentCount) || 0}</p>
          </div>
        </button>`).join("") : `<div class="empty">${posts.length ? "조건에 맞는 글이 없어요." : "아직 글이 없어요. 첫 글을 올려보세요!"}</div>`}
    </div>`;

  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { filter.kind = b.dataset.kind; renderList(); });
  $("q").oninput = e => { filter.q = e.target.value; renderList(); const el = $("q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
  $("fCat").onchange = e => { filter.category = e.target.value; renderList(); };
  $("fLoc").onchange = e => { filter.location = e.target.value; renderList(); };
  $("fRes").onchange = e => { filter.showResolved = e.target.checked; renderList(); };
  app.querySelectorAll(".card").forEach(c => c.onclick = () => openDetail(c.dataset.id));
}

// ===== 화면 2: 글쓰기 =====
function renderWrite() {
  view = "write"; unsubComments?.(); unsubComments = null;
  const today = new Date().toISOString().slice(0, 10);
  app.innerHTML = `
    <button class="back" id="back">← 목록으로</button>
    <h2>글쓰기</h2>
    <form class="panel write" id="wForm">
      <div class="kind-pick">
        <label><input type="radio" name="kind" value="lost" checked> 잃어버렸어요</label>
        <label><input type="radio" name="kind" value="found"> 주웠어요</label>
      </div>
      <label>제목 *<input id="wTitle" maxlength="60" placeholder="예: 검은색 무선이어폰 케이스"></label>
      <div class="row">
        <label>물건 종류 *<select id="wCat">${options(CATEGORIES)}</select></label>
        <label>장소 *<select id="wLoc">${options(LOCATIONS)}</select></label>
        <label>날짜 *<input type="date" id="wDate" value="${today}"></label>
      </div>
      <label>현재 보관 위치 (주운 경우)<input id="wStore" maxlength="60" placeholder="예: 2층 교무실, 행정실"></label>
      <label>설명<textarea id="wDesc" rows="5" maxlength="1000" placeholder="색깔, 특징 등. 주운 물건이라면 주인만 알 수 있는 특징은 적지 말고 남겨두세요!"></textarea></label>
      <label>사진 <small>(학생증·이름표 등은 이름과 번호를 가리고 올려주세요)</small><input type="file" id="wImg" accept="image/*"></label>
      <p class="err" id="wErr" hidden></p>
      <button class="btn big" id="wSubmit">올리기</button>
    </form>`;
  $("back").onclick = renderList;
  $("wForm").onsubmit = async e => {
    e.preventDefault();
    const v = id => $(id).value.trim();
    if (!v("wTitle") || !v("wDate")) { $("wErr").textContent = "제목과 날짜는 꼭 입력해주세요."; $("wErr").hidden = false; return; }
    $("wSubmit").disabled = true; $("wSubmit").textContent = "올리는 중…";
    try {
      const file = $("wImg").files[0];
      const image = file ? await shrinkImage(file) : null;
      const ref = await addDoc(postsCol, {
        kind: document.querySelector("input[name=kind]:checked").value,
        title: v("wTitle"), category: v("wCat"), location: v("wLoc"), date: v("wDate"),
        storage: v("wStore"), description: v("wDesc"), image,
        uid: me.uid, resolved: false, commentCount: 0, createdAt: serverTimestamp(),
      });
      toast("글을 올렸어요");
      openDetail(ref.id);
    } catch (err) {
      fail(err); $("wSubmit").disabled = false; $("wSubmit").textContent = "올리기";
    }
  };
}

// 사진을 작게 줄여서 저장 (Firestore 글 하나는 1MB까지라서)
function shrinkImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 600, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = () => resolve(null);
      img.src = reader.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

// ===== 화면 3: 상세 =====
function openDetail(id) {
  view = "detail"; currentId = id; comments = [];
  unsubComments?.();
  unsubComments = onSnapshot(query(collection(fs, "posts", id, "comments"), orderBy("createdAt")), snap => {
    comments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (view === "detail" && currentId === id) renderDetail();
  }, fail);
  renderDetail();
}

function renderDetail() {
  const p = posts.find(x => x.id === currentId);
  if (!p) { app.innerHTML = `<button class="back" id="back">← 목록으로</button><div class="empty">글을 불러오는 중이거나 삭제된 글이에요.</div>`; $("back").onclick = renderList; return; }
  const mine = p.uid === me.uid;
  // 댓글 단 사람마다 익명1, 익명2… 번호 붙이기 (글쓴이는 '글쓴이')
  const nums = {}; let n = 0;
  const nameOf = uid => uid === p.uid ? "글쓴이" : "익명" + (nums[uid] ??= ++n);
  const draft = $("cText")?.value || "";

  app.innerHTML = `
    <button class="back" id="back">← 목록으로</button>
    <article class="panel">
      <span class="badge ${p.kind === "lost" ? "lost" : "found"}">${kindLabel(p.kind)}</span>${p.resolved ? `<span class="badge resolved">해결됨</span>` : ""}
      <h2>${esc(p.title)}</h2>
      <p class="meta">${mine ? "내 글" : "익명"} · ${fmt(p.createdAt)}</p>
      ${safeImg(p.image) ? `<img class="photo" src="${safeImg(p.image)}" alt="">` : ""}
      <dl>
        <dt>종류</dt><dd>${esc(p.category)}</dd>
        <dt>장소</dt><dd>${esc(p.location)}</dd>
        <dt>날짜</dt><dd>${esc(p.date)}</dd>
        ${p.storage ? `<dt>보관 위치</dt><dd>${esc(p.storage)}</dd>` : ""}
      </dl>
      ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
      ${mine || isAdmin() ? `
      <div class="owner">
        ${mine && !p.resolved ? `<button class="btn" id="resolve">찾았어요 (해결 처리)</button>` : ""}
        <button class="btn ghost" id="del">삭제</button>
      </div>` : ""}
    </article>
    <section class="panel">
      <h3>댓글 ${comments.length}</h3>
      ${comments.map(c => `
        <div class="comment">
          <b class="${c.uid === p.uid ? "writer" : ""}">${nameOf(c.uid)}</b> <span class="meta">${fmt(c.createdAt)}</span>
          ${c.uid === me.uid || mine || isAdmin() ? `<button class="cdel" data-cid="${esc(c.id)}">삭제</button>` : ""}
          <p>${esc(c.text)}</p>
        </div>`).join("")}
      <form class="cform" id="cForm">
        <textarea id="cText" rows="2" maxlength="500" placeholder="댓글 남기기 (예: 혹시 안쪽에 이름 스티커 있나요?)">${esc(draft)}</textarea>
        <button class="btn" id="cSubmit">등록</button>
      </form>
    </section>`;

  $("back").onclick = renderList;
  const postRef = doc(fs, "posts", p.id);

  $("resolve")?.addEventListener("click", () =>
    updateDoc(postRef, { resolved: true }).then(() => toast("해결됨으로 표시했어요 🎉")).catch(fail));

  $("del")?.addEventListener("click", async e => {
    const btn = e.currentTarget;
    if (btn.dataset.sure !== "1") { btn.dataset.sure = "1"; btn.textContent = "정말 삭제할까요? 한 번 더 누르기"; return; }
    try {
      btn.disabled = true;
      const cs = await getDocs(collection(fs, "posts", p.id, "comments"));
      const batch = writeBatch(fs);
      cs.forEach(c => batch.delete(c.ref));
      batch.delete(postRef);
      await batch.commit();
      toast("글을 삭제했어요"); renderList();
    } catch (err) { fail(err); btn.disabled = false; }
  });

  app.querySelectorAll(".cdel").forEach(b => b.onclick = () =>
    deleteDoc(doc(fs, "posts", p.id, "comments", b.dataset.cid)).catch(fail));

  $("cForm").onsubmit = async e => {
    e.preventDefault();
    const text = $("cText").value.trim();
    if (!text) return;
    $("cSubmit").disabled = true;
    try {
      const batch = writeBatch(fs);
      batch.set(doc(collection(fs, "posts", p.id, "comments")), { text, uid: me.uid, createdAt: serverTimestamp() });
      batch.update(postRef, { commentCount: increment(1) });
      await batch.commit();
      $("cText").value = "";
    } catch (err) { fail(err); }
    $("cSubmit").disabled = false;
  };
}

$("home").onclick = () => me ? renderList() : renderLogin();
$("goWrite").onclick = renderWrite;
$("logout").onclick = () => signOut(auth);
</script>
</body>
</html>
